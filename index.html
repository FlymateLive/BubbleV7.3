.lobby-post{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}.lobby-post-heading{display:flex;align-items:center;gap:10px}.lobby-post-heading>div{min-width:0;flex:1}.lobby-post-heading b{display:block;font-size:13px;overflow-wrap:anywhere}.lobby-post-heading small{display:block;font-size:11px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}.lobby-avatar{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(130deg,#7245b7,#c080b2);color:white;font-weight:700}.lobby-post-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.6;margin:14px 0}.lobby-preview{display:block;max-width:100%;max-height:280px;border-radius:10px;margin:12px 0}.lobby-post-stats{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:11px;padding:15px 0}.lobby-live-link{display:block;font-size:12px;color:#996ad4;margin-top:10px}.lobby-post>button{white-space:normal}
.lobby-partner-profile{margin:20px 0}.lobby-partner-profile p{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.lobby-metrics{display:flex;gap:25px;padding-top:8px}.lobby-metrics span{font-size:10px;color:var(--muted)}.lobby-metrics b{display:block;font-size:23px;color:var(--text);margin-bottom:5px}.lobby-partner-stream{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:var(--surface);margin:20px 0}.lobby-stage{padding:24px 20px;text-align:center;background:radial-gradient(ellipse at 60% 25%,#512765,transparent 65%),#171229;color:#f4eafb}.lobby-stage h2{font:700 24px var(--f-display);overflow-wrap:anywhere}.lobby-stage p,.lobby-stage small{color:#c1b2d8;font-size:11px}.lobby-stage .live-simulation{color:#d6c4ed;border-color:#ffffff25}.lobby-stage-orb{width:78px;height:78px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(135deg,#d5b5ff,#8050be);box-shadow:0 0 75px #b174e960;margin:28px auto 10px;font-size:40px}
.lobby-remote-chat{height:270px;overflow:auto;padding:15px;overscroll-behavior:contain}.lobby-chat-message{font-size:12px;line-height:1.6;margin:0 0 11px;overflow-wrap:anywhere}.lobby-chat-message b{color:#a87ae5;margin-right:7px}.lobby-chat-message small{font-size:8px;color:var(--muted);background:var(--surface2);padding:2px 4px;margin-right:7px;border-radius:4px}.lobby-chat-compose{padding:13px;border-top:1px solid var(--line)}.lobby-chat-compose input{min-width:0;flex:1;font-size:12px}.lobby-live-banner{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,#9a63cf 12%,var(--surface));border:1px solid var(--line);border-radius:12px;padding:15px;margin:10px 0;color:var(--text)}.lobby-live-banner>span:nth-child(2){flex:1;min-width:0}.lobby-live-banner b,.lobby-live-banner small{display:block;font-size:12px;overflow-wrap:anywhere}.lobby-live-banner small{font-size:10px;color:var(--muted);margin-top:5px}.lobby-live-banner strong{font-size:11px}.lobby-feed .lobby-live-banner{margin-inline:14px}

.lobby-page .fab{display:none!important}
@media(max-width:480px){.platform-tab{white-space:nowrap}.platform-tabs .platform-status{display:none}.platform-tabs .lobby-shortcut-label{display:inline}}

<style>
:root{

  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0b10; --surface:#15131b; --surface2:#1e1b26; --hover:#1a1822; --line:#2a2633;
    --text:#f2eff7; --muted:#a49eb1; --faint:#6e687b;
    --accent:#ff4d85; --accent-soft:#3b1726; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0b10; --surface:#15131b; --surface2:#1e1b26; --hover:#1a1822; --line:#2a2633;
  --text:#f2eff7; --muted:#a49eb1; --faint:#6e687b;
  --accent:#ff4d85; --accent-soft:#3b1726; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--f-body);padding-inline:16px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}

img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- Grundgerüst ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,640px) 330px;gap:26px;justify-content:center;max-width:1260px;margin:0 auto}

.main{background:var(--surface);border-inline:1px solid var(--line);min-height:100vh;min-width:0;padding-bottom:80px}
.side{padding-block:14px;display:flex;flex-direction:column;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;overflow:auto;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}

.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}

/* ---------- Beiträge ---------- */
.post{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:14px 18px 8px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}

.media{margin-top:10px;border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative;background:var(--surface2);max-width:100%}

.car{position:relative;overflow:hidden}

.act{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:999px;transition:color .15s,background .15s}

.act.r:hover{background:color-mix(in srgb,var(--repost) 12%,transparent)}

/* ---------- Kommentare ---------- */
.cbox{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:start}

.clike{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);padding-top:4px}

.byme{font-size:12px;color:var(--like);display:inline-flex;align-items:center;gap:3px}
.rbox{display:flex;gap:8px;margin:6px 18px 10px 64px}

.empty b{display:block;font:700 26px/1.2 var(--f-display);color:var(--text);margin-bottom:8px;text-wrap:balance}

/* ---------- Profil ---------- */
.banner{height:200px;background:var(--surface2);position:relative;overflow:hidden}

<body>
<div id="root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
"use strict";
/* =====================================================================
   BUBBLE — simuliertes soziales Netzwerk. Alles läuft lokal im Browser.
   Die NPC-Welt wird aus Zufallszahlen *berechnet* statt gespeichert:
   Jede Konto-ID (32 Bit) ergibt immer dasselbe Konto, dieselben Beiträge
   und dieselben Kommentare. Gespeichert wird nur, was der Spieler tut.
   ===================================================================== */

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const HOUR = 3600e3, DAY = 24 * HOUR;
const WORLD_EPOCH = Date.UTC(2025, 0, 1);

/* ---------- Hashing & Zufall ---------- */
function h32() {
  let h = 0x811c9dc5 | 0;
  for (let n = 0; n < arguments.length; n++) {
    const a = arguments[n];
    if (typeof a === 'string') {
      for (let i = 0; i < a.length; i++) h = Math.imul(h ^ a.charCodeAt(i), 16777619);
    } else {
      const lo = a >>> 0, hi = Math.floor(a / 4294967296) >>> 0;
      h = Math.imul(h ^ lo, 0x9E3779B1); h ^= h >>> 15;
      h = Math.imul(h ^ hi, 0x85ebca6b);
    }
    h ^= h >>> 13;
  }
  h = Math.imul(h ^ (h >>> 16), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return (h ^ (h >>> 16)) >>> 0;
}
const u01 = (...a) => h32(...a) / 4294967296;
function RNG(seed) {
  let s = seed >>> 0;
  const f = () => {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    f,
    i: n => Math.floor(f() * n),
    ri: (a, b) => a + Math.floor(f() * (b - a + 1)),
    rg: (a, b) => a + f() * (b - a),
    ch: p => f() < p,
    pick: a => a[Math.floor(f() * a.length)],
    // gewichtete Auswahl: [[gewicht, wert], ...]
    wp(items) { let t = 0; for (const x of items) t += x[0]; let v = f() * t; for (const x of items) { v -= x[0]; if (v <= 0) return x[1]; } return items[items.length - 1][1]; },
    shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    seed: () => (f() * 4294967296) >>> 0
  };
}
// Log-Normal-artige Streuung um 1
const spread = (r, s) => Math.exp((r.f() + r.f() + r.f() - 1.5) * s);

/* ---------- Umkehrbare 32-Bit-Permutation (Feistel) ----------
   Follower Nr. k des Spielers  <->  NPC-ID. So muss keine Followerliste
   gespeichert werden und "Folgt dir" bleibt trotzdem überall stimmig. */
const feF = (x, k, salt) => h32(x, k, salt) & 0xffff;
function fperm(v, salt) { let L = v >>> 16, R = v & 0xffff; for (let k = 0; k < 4; k++) { const t = R; R = (L ^ feF(R, k, salt)) & 0xffff; L = t; } return ((L << 16) | R) >>> 0; }
function finv(v, salt) { let L = v >>> 16, R = v & 0xffff; for (let k = 3; k >= 0; k--) { const t = L; L = (R ^ feF(L, k, salt)) & 0xffff; R = t; } return ((L << 16) | R) >>> 0; }

/* ---------- Formatierung ---------- */
const nf = new Intl.NumberFormat('de-DE');
function fmt(n) {
  n = Math.max(0, Math.floor(n || 0));
  if (n < 10000) return nf.format(n);
  if (n < 1e6) return (n < 1e5 ? (Math.floor(n / 100) / 10).toFixed(1) : Math.floor(n / 1000)).toString().replace('.', ',').replace(',0', '') + 'K';
  if (n < 1e9) return (Math.floor(n / 1e5) / 10).toFixed(1).replace('.', ',').replace(',0', '') + ' Mio.';
  return (Math.floor(n / 1e8) / 10).toFixed(1).replace('.', ',').replace(',0', '') + ' Mrd.';
}
const fmtFull = n => nf.format(Math.floor(n || 0));
const MONTHS = ['Jan.', 'Feb.', 'März', 'Apr.', 'Mai', 'Juni', 'Juli', 'Aug.', 'Sep.', 'Okt.', 'Nov.', 'Dez.'];
const MONTHS_L = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
function ago(t, now = gameNow()) {
  const d = Math.max(0, now - t);
  if (d < 45e3) return 'gerade eben';
  if (d < HOUR) return `vor ${Math.max(1, Math.round(d / 60e3))} Min.`;
  if (d < DAY) return `vor ${Math.round(d / HOUR)} Std.`;
  if (d < 7 * DAY) return `vor ${Math.round(d / DAY)} T.`;
  const dt = new Date(t), nw = new Date(now);
  return `${dt.getDate()}. ${MONTHS[dt.getMonth()]}${dt.getFullYear() !== nw.getFullYear() ? ' ' + dt.getFullYear() : ''}`;
}
function clock(t) { const d = new Date(t); return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' · ' + d.getDate() + '. ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function linkify(text) {
  return esc(text)
    .replace(/(^|[\s(])#([\p{L}\p{N}_]{2,40})/gu, (m, pre, tag) => `${pre}<a class="tag" data-go="#/tag/${encodeURIComponent(tag.toLowerCase())}">#${tag}</a>`)
    .replace(/(^|[\s(])@([a-z0-9._]{2,32})/gi, (m, pre, h) => `${pre}<a class="men" data-act="mention" data-h="${h}">@${h}</a>`);
}
const tagsOf = text => Array.from(new Set((String(text).match(/#[\p{L}\p{N}_]{2,40}/gu) || []).map(t => t.slice(1).toLowerCase())));

/* ---------- Speicher: IndexedDB mit Fallback im Arbeitsspeicher ---------- */
const DB = {
  db: null, mem: new Map(),
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const rq = indexedDB.open('bubble-social', 1);
        rq.onupgradeneeded = () => { rq.result.createObjectStore('kv'); rq.result.createObjectStore('media'); };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
      });
    } catch (e) { this.db = null; }
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      try {
        const t = this.db.transaction(store, mode), st = t.objectStore(store), rq = fn(st);
        t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
      } catch (e) { rej(e); }
    });
  },
  async get(store, key) { if (!this.db) return this.mem.get(store + ':' + key); try { return await this.tx(store, 'readonly', s => s.get(key)); } catch (e) { return this.mem.get(store + ':' + key); } },
  async put(store, key, val) { this.mem.set(store + ':' + key, val); if (!this.db) return; try { await this.tx(store, 'readwrite', s => s.put(val, key)); this.mem.delete(store + ':' + key); } catch (e) { } },
  async del(store, key) { this.mem.delete(store + ':' + key); if (!this.db) return; try { await this.tx(store, 'readwrite', s => s.delete(key)); } catch (e) { } },
  async clear() { this.mem.clear(); if (!this.db) return; try { await this.tx('kv', 'readwrite', s => s.clear()); await this.tx('media', 'readwrite', s => s.clear()); } catch (e) { } }
};
// Objekt-URLs für hochgeladene Medien: nur bei Bedarf erzeugen, alte wieder freigeben
const MediaURL = {
  map: new Map(), max: 40,
  async get(id) {
    if (this.map.has(id)) { const u = this.map.get(id); this.map.delete(id); this.map.set(id, u); return u; }
    const blob = await DB.get('media', id); if (!blob) return null;
    const url = URL.createObjectURL(blob); this.map.set(id, url);
    while (this.map.size > this.max) { const [k, v] = this.map.entries().next().value; this.map.delete(k); URL.revokeObjectURL(v); }
    return url;
  }
};
async function hydrateMedia(el = document) {
  for (const n of $$('[data-mid]', el)) {
    const id = n.dataset.mid; n.removeAttribute('data-mid');
    const url = await MediaURL.get(id); if (url) n.src = url;
  }
}

/* Tonfall auf einen Text anwenden */
function sty(t, tone, r) {
  if (!t) return t;
  switch (tone) {
    case 'lower': t = t.toLowerCase(); if (r.ch(.6)) t = t.replace(/[.!]+$/, ''); if (r.ch(.4)) t = t.replace(/,/g, ''); break;
    case 'caps': if (r.ch(.5)) t = t.toUpperCase(); t = t.replace(/[!.]*$/, r.pick(['!!!', '!!', ''])); break;
    case 'emoji': if (!/[\p{Extended_Pictographic}\uFE0F]$/u.test(t)) t += ' ' + r.pick(W.e_pos) + (r.ch(.5) ? r.pick(W.e_pos) : ''); break;
    case 'hype': t = t.replace(/\b(so|mega|voll)\b/i, m => m + m.slice(-1).repeat(r.ri(1, 3))); if (r.ch(.5)) t = t.replace(/[.!]*$/, '!!'); break;
    case 'chill': if (r.ch(.5)) t = t[0].toLowerCase() + t.slice(1); t = t.replace(/!+/g, ''); if (r.ch(.25) && !/[\p{Extended_Pictographic}\uFE0F]$/u.test(t)) t += r.pick([' ngl', ' tbh', ' halt', ' irgendwie']); break;
    case 'sarc': if (r.ch(.35)) t += r.pick([' 😌', ' 🙂', ' lol', ' 💅']); break;
    case 'shy': t = t.toLowerCase().replace(/!+/g, ''); if (r.ch(.5)) t += r.pick([' 🥺', ' 👉👈', ' hehe', ' :)']); break;
    case 'formal': t = t[0].toUpperCase() + t.slice(1); if (!/[.!?)]$/u.test(t) && !/[\p{Extended_Pictographic}\uFE0F]$/u.test(t)) t += r.pick(['.', '!', ' 👍']); if (r.ch(.08)) t += r.pick([' LG', ' Liebe Grüße', ' 😊']); break;
  }
  if (r.ch(.05)) t = t.replace(/\b(nicht)\b/, r.pick(['nich', 'net', 'ned'])).replace(/\b(habe)\b/, 'hab');
  if (r.ch(.04) && !t.includes('@')) t = t.replace(/(^|\s)(\p{L}{2})(\p{L})(\p{L})(\p{L}+)/u, '$1$2$4$3$5'); // Tippfehler
  if (r.ch(.03)) t = t.replace(/(\p{L})(\p{L}*)$/u, (m, a, b) => a + b + b.slice(-1));
  return t;
}

  else text = ex(r.pick(POSTS[niche] || POSTS.lifestyle), r, ctx);

  if (scene === 'text' && !poll && r.ch(.25) && n.niche !== 'memes') scene = r.pick(NICHES[n.niche].sc);

  if (scene === 'meme') label = [r.pick(MEME_TOP), r.pick(MEME_BOT)];
  if (scene === 'music') label = r.pick(W.track);
  if (scene === 'ball') label = [r.pick(W.team), r.pick(W.score), r.pick(W.team)];
  if (scene === 'gym') label = r.pick(['PR ' + r.ri(8, 22) * 10 + ' KG', 'DAY ' + r.ri(2, 180), 'LEG DAY', 'NO EXCUSES', r.ri(5, 42) + ' KM']);
  if (scene === 'game') label = r.pick(['VICTORY', 'GG', '#1', 'RANK UP', r.ri(8, 31) + ' KILLS', 'CLUTCH']);
  if (r.ch(.42)) {
    const pool = (TAGS[n.niche] || '').split(' ').concat(TAGS_GEN);
    const tags = r.shuffle(pool).slice(0, r.ri(1, 4)).map(t => '#' + t);
    text += (r.ch(.6) ? '\n\n' : ' ') + tags.join(' ');

  return { text, scene, seed: r.seed(), label, video, slides, poll, dur: r.ri(7, 58) };
}

/* ---------- Beitrag des Spielers planen ---------- */
function planPost(p) {
  const r = RNG(h32(S.seed, p.id, 'plan'));
  const F = Math.max(totalFollowers(), 0);
  const recent = S.posts.filter(q => q.t > gameNow() - 6 * HOUR).length;
  const quality = spread(r, .55) * (p.media.length ? 1.25 : 1) * (p.media.some(m => m.type === 'video') ? 1.5 : 1) * (p.card ? 1.1 : 1) * (p.poll ? 1.15 : 1)
    * (p.tags.length ? 1 + Math.min(p.tags.length, 5) * .06 : 1) * (p.text.length > 20 && p.text.length < 280 ? 1.1 : 1) * (recent > 4 ? .75 : 1);
  const newbie = S.posts.length <= 3 ? 2.2 : 1;
  const fRate = r.rg(.12, .38) * (F > 100000 ? .7 : 1) * (F > 5e6 ? .7 : 1);
  const xBase = (r.rg(40, 260) * (1 + Math.log10(1 + F) * .9) + F * fRate * r.rg(.1, .5)) * quality * newbie;
  const vr = r.f();
  let viral = 0, vMul = 0;
  if (vr < .004) { viral = 2; vMul = r.rg(120, 900); }
  else if (vr < .055) { viral = 1; vMul = r.rg(8, 60); }
  p.plan = {
    F, q: +quality.toFixed(3), fReach: F * fRate, xReach: xBase, viral, vMul, vRoll: vr,
    delay: r.rg(1.5, 9), tau1: r.rg(1.5, 4.5), tau2: r.rg(30, 90),

// Erwartete Summen zum effektiven Alter ea (Stunden), inkl. aktueller Hebel

/* ---------- Kommentar-Art wählen ---------- */
function pickKind(r, o) {
  if (o.n.lang === 'en') return r.ch(.85) ? 'en' : 'emo';
  if (o.n.tone === 'bot' || r.ch(S.settings.bots / 100)) return 'bot';
  const toneHate = ['critic', 'troll', 'sarc'].includes(o.n.tone) ? 2.5 : 1;
  const hateW = S.settings.haters * 1.1 * toneHate * (o.viral ? 1.8 : 1) * (o.fol ? .3 : 1);
  return r.wp([
    [18, 'pos'], [o.fol ? 16 : 3, 'fan'], [9, 'rel'], [7, 'ask'], [6, 'tag'], [o.topics.length ? 24 : 0, 'top'], [o.q ? 22 : 0, 'q'], [hateW, 'hate'],
    [o.n.tone === 'troll' ? 16 : 4, 'troll'], [o.n.tone === 'emoji' ? 20 : 5, 'emo'], [o.viral ? 12 : 0, 'fyp'], [o.media === 'video' ? 9 : 0, 'vid'], [o.media === 'img' ? 8 : 0, 'img'], [o.poll ? 18 : 0, 'poll']

const KINDS = ['pos', 'fan', 'rel', 'ask', 'tag', 'top', 'q', 'hate', 'troll', 'emo', 'fyp', 'vid', 'img', 'poll', 'bot', 'en'];

/* ---------- Ein Simulationsschritt ---------- */
let SUMMARY = null;
function tick(extraHours = 0) {
  if (!S || ADVANCING_WORLD || VAULT_SWITCHING) return;
  if (extraHours > 0) return advanceWorld(extraHours);
  const now = gameNow(), wall = Date.now();
  let dt = Math.max(0, wall - S.lastTick); S.lastTick = wall;
  tickLive(wall);
  lobbyPulse();
  if (S.settings.paused && !extraHours) return;
  if (dt > 45 * DAY) dt = 45 * DAY;
  const dh = dt / HOUR * S.settings.speed + extraHours;
  const events = { likes: 0, comments: 0, follows: 0, reposts: 0 };
  for (const p of S.posts) {
    if (p.done && !extraHours) continue;
    p.ea += dh;
    stepPost(p, now, dt, events);
  }
  stepPlayerReposts(dh);
  runPending(now);
  careerTick(now);
  maybeDM(now, dt);
  const tf = totalFollowers();
  const last = S.hist[S.hist.length - 1];
  if (tf !== last[1] && now - last[0] > 20e3) { S.hist.push([now, tf]); if (S.hist.length > 600) S.hist = S.hist.filter((x, i) => i % 2 === 0 || i > 560); }
  while (S.reached < MILESTONES.length && tf >= MILESTONES[S.reached]) {
    const m = MILESTONES[S.reached++];
    notify({ type: 'milestone', text: `Du hast ${fmtFull(m)} Follower erreicht! 🎉` });
    if (m >= 1000) queueDM('collab', now + 20e3 + Math.random() * 60e3);
    bigToast(`🎉 ${fmtFull(m)} Follower!`);
  }
  if (events.likes || events.comments || events.follows) { markDirty(); onLive(events); }
  return events;
}
function stepPost(p, now, dt, ev) {
  const T = targets(p), st = p.st;

  const add = (k, max) => { const d = Math.max(0, Math.floor(T[k]) - st[k]); st[k] += d; return d; };

  if (T.viral && !p.wasViral) { p.wasViral = true; S.viralCount++; notify({ type: 'viral', key: 'p' + p.id, text: 'Dein Beitrag geht gerade viral! 🚀' }); bigToast('🚀 Dein Beitrag geht viral!'); }
  const F = Math.max(1, totalFollowers());
  const fShare = clamp(T.fV / Math.max(1, T.v), .08, .95);
  const pickNpc = () => (S.followers > 0 && r.ch(fShare)) ? followerId(r.i(S.followers)) : (r.seed() | 0x1) >>> 0;
  // Follower
  if (dnf > 0) {
    const from = S.followers; S.followers = Math.min(2e9 - S.extraF.length, S.followers + dnf); ev.follows += S.followers - from;
    const actors = []; for (let i = 0; i < Math.min(3, dnf); i++) actors.push(followerId(from + dnf - 1 - i));
    notify({ type: 'follow', actors, count: dnf, merge: true });
    if (dnf <= 3) actors.forEach(a => toast(a, 'folgt dir jetzt', null, '#/u/' + a));
  }
  // Likes
  if (dl > 0) {
    ev.likes += dl;
    const actors = []; for (let i = 0; i < Math.min(3, dl); i++) { const id = pickNpc(); actors.push(id); p.likers.unshift(id); }
    if (p.likers.length > 40) p.likers.length = 40;
    notify({ type: 'like', key: 'p' + p.id, actors, count: dl, merge: true });
  }
  if (dr > 0) {
    ev.reposts += dr;
    const actors = []; for (let i = 0; i < Math.min(2, dr); i++) { const id = pickNpc(); actors.push(id); p.reposters.unshift(id); }
    if (p.reposters.length > 30) p.reposters.length = 30;
    recordNpcReposts(p, dr, actors);
    notify({ type: 'repost', key: 'p' + p.id, actors, count: dr, merge: true });
  }
  if (p.poll && dv > 0) { const votes = Math.max(0, Math.floor(T.v * p.plan.q * .12) - st.pv.reduce((a, b) => a + b, 0)); for (let i = 0; i < Math.min(votes, 400); i++) st.pv[pollPick(p, r)]++; if (votes > 400) st.pv[pollPick(p, r)] += votes - 400; }

  if (dc > 0) {
    ev.comments += dc;
    const store = Math.min(dc, 40, 400 - p.cm.length);
    const topicsCtx = { topics: p.topics, q: p.q, media: p.media[0] ? (p.media[0].type === 'video' ? 'video' : 'img') : (p.card ? 'img' : null), poll: !!p.poll, viral: T.viral || p.wasViral };
    for (let i = 0; i < store; i++) {
      const id = pickNpc(), n = npc(id);
      const kind = pickKind(r, { ...topicsCtx, n, fol: isFollower(id) });
      const t = Math.round(now - dt * (1 - (i + 1) / store) * r.f());
      p.cm.push([id, r.seed(), Math.min(now, Math.max(p.t + 2000, t)), KINDS.indexOf(kind)]);
      rememberSocialNPC(id, p);
      if (i < 2) {
        const txt = commentText(postCtx(p), n, kind, p.cm[p.cm.length - 1][1]);
        notify({ type: 'comment', key: 'p' + p.id, actors: [id], text: txt, ci: p.cm.length - 1 });
        if (i === 0) toast(id, 'hat kommentiert: ' + txt, null, '#/post/p' + p.id);
      }
    }
    if (dc > store && store >= 2) notify({ type: 'comments', key: 'p' + p.id, count: dc - Math.min(store, 2), actors: [], merge: true });

}

function runPending(now) {

      const txt = set ? dmText(set, n, job.seed, {}) : /\?/.test(job.text) && Math.random() < .75 ? dmText('chatQ', n, job.seed, { city: n.city }) : (Math.random() < .5 ? npcAnswer(job.text, n, job.seed, { name: S.me.name.split(' ')[0] }) : dmText('chat', n, job.seed, { name: S.me.name.split(' ')[0], city: n.city }));
      conv.msgs.push({ me: 0, text: txt, t: now }); conv.typing = false; conv.unread++;

  }

}

/* ---------- NPC-Beiträge (vollständig berechnet) ---------- */
function npcPostTime(n, k) { return fromNpcTime(WORLD_EPOCH + (k + u01(n.id, k, 'jit') * .8 - .4) * n.rateH * HOUR + u01(n.id, 'off') * n.rateH * HOUR); }

}

function getPost(key) {

// Feed "Für dich": jüngste Beiträge aus dem Pool, gewichtet nach Größe und Frische
let FEED_CACHE = null;
function buildFeed(mode, now = gameNow()) {
  const out = [];
  const windowH = 30;
  if (mode === 'following') {
    for (const id of S.following) { const n = npc(id); let k = npcLastK(n, now); for (let j = 0; j < 6 && k >= 0; j++, k--) { const t = npcPostTime(n, k); if (t <= now && now - t < 7 * DAY) out.push({ key: `n${id}.${k}`, t, score: t }); } }
  } else {
    const r = RNG(h32(S.seed, Math.floor(now / (10 * 60e3))));
    const start = r.i(POOL), count = 2600;
    for (let i = 0; i < count; i++) {
      const id = poolId((start + i * 11) % POOL), n = npc(id);
      const k = npcLastK(n, now); if (k < 0) continue;
      const t = npcPostTime(n, k); if (t > now || now - t > windowH * HOUR) continue;
      const fol = S.following.includes(id) ? 3 : 1;
      const score = (1 - (now - t) / (windowH * HOUR)) * (0.6 + Math.log10(10 + n.base) * .25) * fol * (0.5 + u01(id, k, S.seed));

  for (const [key, it] of Object.entries(S.npcInter)) {
    if (!it.r || now - it.rt > 3 * DAY || out.some(x => x.key === key) || !getPost(key)) continue;
    out.push({ key, t: it.rt, score: mode === 'following' ? it.rt : 10 });

function commentList(v) {
  const now = gameNow(), out = [], seen = new Set();
  const ctx = { topics: v.topics, kw: v.kw, poll: v.poll ? { opts: v.poll } : null, authorFirst: v.authorFirst };
  const pop = Math.pow(Math.max(1, v.st.l), .62);
  const speedF = v.mine ? S.settings.speed : mult('npc');
  const mk = (id, seed, t, kind, path, cid, replies) => {
    const n = npc(id); let text = commentText(ctx, n, kind, seed);
    for (let i = 1; seen.has(text) && i < 5; i++) text = commentText(ctx, n, kind, h32(seed, i));

    const kf = { hate: 1.6, troll: 2, rel: 1.8, fyp: 1.3, tag: .6, bot: .02, emo: .5, ask: .7 }[kind] || 1;
    const age = 1 - Math.exp(-Math.max(0, now - t) / HOUR * speedF / 3);

  if (v.mine) v.p.cm.forEach((c, i) => { const row = mk(c[0], c[1], c[2], KINDS[c[3]], ['cm', i], `${v.key}:${i}`, c[5]); if (c[6]) row.text = c[6]; out.push(row); });
  const storedN = v.mine ? v.p.cm.length : 0, myN = v.inter.c ? v.inter.c.length : 0;

  const q = v.mine ? v.p.q : /\?/.test(v.text || '');

  for (let j = 0; j < synthN; j++) {
    const jj = storedN + j, seed = h32(v.key, jj, 'cs');

    const n = npc(id);

  }

  if (CSORT === 'new') out.sort((a, b) => b.t - a.t);

}
function autoReplies(c, v, now) {

  const chance = { hate: .6, troll: .35, tag: .55, ask: .45, bot: .35, q: .3, poll: .4, rel: .2 }[c.kind] || .12;

function userListView(who, kind) {

  const shown = VIEW_STATE.uShown || 30;
  let rows = [], total;
  if (me && kind === 'followers') {
    total = totalFollowers();

    for (let k = S.followers - 1; k >= 0 && ids.length < shown; k--) ids.push(followerId(k));
    rows = ids.map(id => userRow(npc(id)));
  } else if (me) {
    total = S.following.length; rows = S.following.slice(0, shown).map(id => userRow(npc(id)));
  } else if (kind === 'followers') {
    total = npcFollowers(a);
    if (S.following.includes(a.id)) rows.push(userRow(meObj()));
    for (let j = 0; j < Math.min(shown, total); j++) rows.push(userRow(npc(h32(a.id, j, 'fw'))));
  } else {
    total = a.following;

VIEWS.search = r => {
  const raw = r.a.trim(), q = raw.toLowerCase().replace(/^[@#]/, '');
  const found = new Map();
  if (q.length >= 2) {
    for (const [h, id] of HANDLES) { if (found.size >= 12) break; if (h.includes(q)) found.set(id, npc(id)); }
    for (let i = 0; i < 14000 && found.size < 25; i++) {
      const id = poolId((h32(q) + i) % POOL), n = npc(id);
      if (n.handle.includes(q) || n.name.toLowerCase().includes(q)) found.set(id, n);
    }
  }
  const mine = S.posts.filter(p => p.text.toLowerCase().includes(q)).slice(0, 10);
  const tagLink = /^[\p{L}\p{N}_]{2,40}$/u.test(q) ? `<a class="trend" data-go="#/tag/${encodeURIComponent(q)}"><small>Hashtag</small><b>#${esc(q)}</b></a>` : '';

    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', .86));

  } catch (e) { return file; }
}

  return `<div class="form">
    <div class="avpick"><img src="${avatarSrc(prev)}" alt="Profilbild-Vorschau" id="pe-av-img"><div class="inl">
      <button class="btn ghost sm" data-act="pedice">${IC.dice.replace('<svg', '<svg width="16" height="16" style="vertical-align:-3px"')} Neu würfeln</button>
      <button class="btn ghost sm" data-act="pegender">${PE.g === 'f' ? 'Weiblich' : 'Männlich'} ⇄</button>
      <label class="btn ghost sm" for="pe-av-file" style="cursor:pointer">Foto hochladen</label><input type="file" id="pe-av-file" accept="image/*" hidden></div></div>
    <label>Anzeigename<input class="field" id="pe-name" maxlength="40" value="${esc(PE.name)}" placeholder="z. B. Mia Sommer" autocomplete="off"></label>
    <label>Handle<input class="field" id="pe-handle" maxlength="20" value="${esc(PE.handle)}" placeholder="mia.sommer" autocomplete="off"></label>
    <label>Bio<textarea class="field" id="pe-bio" maxlength="160" rows="3" placeholder="Worum geht's bei dir?">${esc(PE.bio)}</textarea></label>
    ${welcome ? '' : `<label>Link<input class="field" id="pe-link" maxlength="60" value="${esc(PE.link)}" placeholder="meine-seite.de"></label>
    <div><div style="font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:6px">Banner</div><div class="banner" style="height:110px;border-radius:12px"><img src="${PE.banner || sceneSrc(PE.bannerScene, PE.bannerSeed)}" alt=""></div>
      <div class="inl" style="margin-top:8px"><button class="btn ghost sm" data-act="pebanner">Neu würfeln</button><label class="btn ghost sm" for="pe-banner-file" style="cursor:pointer">Bild hochladen</label><input type="file" id="pe-banner-file" accept="image/*" hidden></div></div>`}
  </div>`;
}
function readProfileForm() { for (const k of ['name', 'handle', 'bio', 'link']) { const el = $('#pe-' + k); if (el) PE[k] = el.value; } }
function renderProfileForm() { readProfileForm(); const box = $('#pe-box'); if (box) box.innerHTML = profileFormHTML(!S); }
const cleanHandle = h => String(h).toLowerCase().split(/([._])/).map(x => x === '.' || x === '_' ? x : tl(x)).join('').replace(/([._])[._]+/g, '$1').replace(/^[._]+|[._]+$/g, '');
ACT.gonotif = () => { closeModal(); location.hash = '#/notifications'; };
Object.assign(ACT, {
  pedice() { readProfileForm(); PE.av = { t: 'face', seed: (Math.random() * 4e9) >>> 0 }; renderProfileForm(); },
  pegender() { readProfileForm(); PE.g = PE.g === 'f' ? 'm' : 'f'; if (PE.av.t !== 'face') PE.av = { t: 'face', seed: (Math.random() * 4e9) >>> 0 }; renderProfileForm(); },
  pebanner() { readProfileForm(); PE.banner = null; PE.bannerScene = RNG(gameNow()).pick(['city', 'land', 'beach', 'art', 'music', 'game']); PE.bannerSeed = (Math.random() * 4e9) >>> 0; renderProfileForm(); },
  editprofile() {
    PE = { name: S.me.name, handle: S.me.handle, bio: S.me.bio, link: S.me.link || '', av: S.me.av, g: S.me.g, banner: S.me.banner || null, bannerScene: S.me.bannerScene || 'city', bannerSeed: S.me.bannerSeed || S.seed };
    openModal('Profil bearbeiten', '<div id="pe-box"></div>', '<span></span><button class="btn acc" data-act="pesave">Speichern</button>');
    renderProfileForm();
  },
  pesave() {
    readProfileForm();
    const handle = cleanHandle(PE.handle).slice(0, 20);
    if (!PE.name.trim() || handle.length < 3) { note('Name und ein Handle mit mindestens 3 Zeichen sind nötig.'); return; }
    Object.assign(S.me, { name: PE.name.trim(), handle, bio: PE.bio.trim(), link: PE.link.trim(), av: PE.av, g: PE.g, banner: PE.banner, bannerScene: PE.bannerScene, bannerSeed: PE.bannerSeed });
    closeModal(); markDirty(); renderShell(); renderRoute(true); note('Profil gespeichert');
  },
  async create() {
    readProfileForm();
    const handle = cleanHandle(PE.handle || PE.name).slice(0, 20);
    if (!PE.name.trim()) { note('Wie soll dein Konto heißen?'); $('#pe-name').focus(); return; }
    if (handle.length < 3) { note('Dein Handle braucht mindestens 3 Zeichen (a–z, 0–9, Punkt, Unterstrich).'); $('#pe-handle').focus(); return; }
    S = newState({ name: PE.name.trim(), handle, bio: PE.bio.trim(), link: '', av: PE.av, g: PE.g, verified: false });
    dirty = true; await save();
    renderShell(); location.hash = '#/home'; renderRoute(); startLoop(); initLobby();
    setTimeout(() => openComposer(), 400);
  }
});
function renderWelcome() {
  PE = { name: '', handle: '', bio: '', av: { t: 'face', seed: (Math.random() * 4e9) >>> 0 }, g: Math.random() < .5 ? 'f' : 'm' };
  $('#root').innerHTML = `<div class="welcome"><div class="logo" style="padding:0"><span class="bub"></span>bubble</div>
    <h1>Dein eigenes soziales Netzwerk – nur für dich.</h1>
    <p>Poste Texte, Bilder, Videos und Umfragen. Tausende berechnete NPC-Konten reagieren und posten selbst. Deine Welt bleibt lokal; über die optionale Spieler-Lobby kannst du Posts und Livechat mit einem zweiten Spieler teilen.</p>
    <div id="pe-box"></div>
    <button class="btn acc" data-act="create" style="width:100%;margin-top:18px;padding:13px">Konto erstellen</button></div>`;
  renderProfileForm();
  const nameIn = $('#pe-name'), hIn = $('#pe-handle');
  nameIn.addEventListener('input', () => { if (!hIn.dataset.touched) hIn.value = cleanHandle(nameIn.value.replace(/\s+/g, '.')).slice(0, 20); });
  hIn.addEventListener('input', () => hIn.dataset.touched = 1);
  nameIn.focus();
}

/* ---------- Start ---------- */
function migrate(st) {
  migrateWorld(st);
  migrateLobby(st);
  migrateCareer(st);
  st.settings = { ...SETTINGS_DEFAULT, ...(st.settings || {}) };
  st.counters = st.counters || { dmT: gameNow() + 90e3 };
  for (const k of ['extraF', 'following', 'posts', 'notifs', 'pending', 'hist']) st[k] = st[k] || [];
  for (const k of ['npcInter', 'likedC', 'dms']) st[k] = st[k] || {};
  if (!st.hist.length) st.hist = [[gameNow(), st.followers || 0]];
  for (const c of Object.values(st.dms)) c.typing = false;
  migrateLive(st);
  return st;
}
function snapshot() { const s = sums(); return { f: totalFollowers(), l: s.l, c: s.c, v: s.v }; }
let LOOP = null, hiddenSkip = 0;
function startLoop() {
  if (LOOP) return;
  LOOP = setInterval(() => { if (!S) return; if (document.hidden && (++hiddenSkip % 5)) return; tick(); liveRefresh(); }, 1000);
  document.addEventListener('visibilitychange', () => { if (!S) return; if (document.hidden) { dirty = true; save(); } else { tick(); liveRefresh(); } });
  window.addEventListener('pagehide', () => { if (S) { dirty = true; save(); } });
}
function showWelcomeBack(b, a, away) {
  const d = (k, l) => `<div class="tile"><small>${l}</small><b>+${fmt(Math.max(0, a[k] - b[k]))}</b></div>`;
  openModal('Willkommen zurück', `<p style="margin:0 0 12px" class="muted">Seit ${ago(gameNow() - away).replace('vor ', '')} ist in deiner Bubble einiges passiert:</p><div class="tiles">${d('f', 'Follower')}${d('v', 'Aufrufe')}${d('l', 'Likes')}${d('c', 'Kommentare')}</div>`,
    `<button class="btn ghost" data-act="gonotif">Mitteilungen ansehen</button><button class="btn acc" data-act="close-modal">Weiter</button>`, { width: '480px' });
}
async function boot() {
  await DB.open();
  let st = null;
  try { st = await DB.get('kv', 'state'); } catch (e) { }
  if (!st) { applyTheme('auto'); renderWelcome(); return; }
  S = migrate(st); applyTheme(S.settings.theme);
  const before = snapshot(), away = Date.now() - (S.lastSeen || S.lastTick);
  tick();
  renderShell();
  if (!location.hash || location.hash === '#') location.hash = '#/home';
  renderRoute();
  const after = snapshot();
  if (away > 5 * 60e3 && (after.f > before.f || after.l > before.l || after.c > before.c)) showWelcomeBack(before, after, away);
  startLoop(); initLobby();
}
</script>
<script>
// Bundled from bubble-live.js
"use strict";

// Both platforms deliberately share S.me, NPC IDs, IndexedDB and save exports.
// Only a bounded set of memorable people needs storage; the crowd is simulated.
const LIVE_CATEGORIES = ['Just Chatting', 'Gaming', 'Musik', 'Kreativ', 'Community'];
const LIVE_DEFAULTS = { promoPercent: 1.5, followPercent: 3, chatPace: 'normal', growthSpeed: 100, discovery: 100, returnPercent: 12, retention: 60, backPercent: 1.08, viralChance: 5, viewerOverride: null, raidChance: 20, raidScale: 100 };
const LIVE_GROWTH_CONTROLS = [
  ['growthSpeed', 'Wachstumstempo', 'Zuschauerzulauf und Follower-Gewinne werden schneller. Die Stream-Uhr läuft normal.', 0, 1000, 10, '%'],
  ['discovery', 'Entdecken-Reichweite', 'Wie viele neue Leute deinen Stream unabhängig von Werbung finden.', 0, 1000, 10, '%'],
  ['returnPercent', 'Wiederkehrende Live-Follower', 'Dieser Anteil deiner Live-Follower kann in deinem Stream zuschauen.', 0, 100, 1, '%'],
  ['retention', 'Zuschauerbindung', 'Eine stärkere Bindung erhöht das dauerhaft erreichbare Publikum.', 10, 100, 1, '%'],
  ['promoPercent', 'Bubble → Live', 'Anteil deiner Bubble-Follower pro Ankündigung. Gilt für die nächste Werbung.', 0, 100, .1, '%'],
  ['followPercent', 'Neue Live-Follower', 'Anteil pro Zuschauer-Minute. Bei 0 entstehen auch keine einzelnen NPC-Follows.', 0, 20, .1, '%'],
  ['backPercent', 'Live → Bubble', 'Anteil neu entdeckter Zuschauer pro Minute, der deinem Bubble-Account folgt.', 0, 10, .01, '%'],
  ['viralChance', 'Chance auf einen Zuschauer-Schub', 'Wahrscheinlichkeit pro aktiver Wachstumsminute für einen vorübergehenden Schub.', 0, 100, 1, '%'],
  ['raidChance', 'Eingehende Raids', 'Chance pro aktiver Stream-Minute, dass ein NPC-Streamer seine Community zu dir schickt. 0 deaktiviert eingehende Raids.', 0, 100, 1, '%'],
  ['raidScale', 'Größe eingehender Raids', 'Skaliert die Zuschauerzahl, die andere Streamer zu dir mitbringen.', 10, 500, 10, '%']
];
const LIVE_PACES = { cozy: 6500, normal: 3500, fast: 1800 };
const LIVE_MEMORY_LIMIT = 200;

function newLiveState() {
  return { version: 2, followers: 0, nextSession: 1, nextMessage: 1,
    draft: { title: 'Einfach zusammen abhängen ✨', category: 'Just Chatting' },
    settings: { ...LIVE_DEFAULTS }, memories: {}, history: [], active: null, campaign: null, rooms: {}, followingLive: [], raids: [] };
}

function migrateLive(st) {
  const defaults = newLiveState(), old = st.live || {};
  st.live = { ...defaults, ...old, settings: { ...LIVE_DEFAULTS, ...old.settings },
    draft: { ...defaults.draft, ...old.draft } };
  const l = st.live;
  l.followers = clamp(Math.floor(Number(l.followers) || 0), 0, 2e9);
  for (const [key, , , min, max] of LIVE_GROWTH_CONTROLS) l.settings[key] = clamp(Number.isFinite(+l.settings[key]) ? +l.settings[key] : LIVE_DEFAULTS[key], min, max);
  l.settings.viewerOverride = l.settings.viewerOverride == null ? null : clamp(Math.floor(Number(l.settings.viewerOverride) || 0), 0, 2e9);
  l.rooms = l.rooms && typeof l.rooms === 'object' && !Array.isArray(l.rooms) ? l.rooms : {};
  l.followingLive = Array.isArray(l.followingLive) ? [...new Set(l.followingLive.filter(validLiveHostId))].slice(0, 60) : [];
  for (const [id, room] of Object.entries(l.rooms)) {
    if (!validLiveHostId(+id) || !room || typeof room !== 'object') { delete l.rooms[id]; continue; }
    room.messages = (Array.isArray(room.messages) ? room.messages : []).slice(-100);
    room.pending = []; room.lastWall = Date.now();
  }
  Object.keys(l.rooms).slice(24).forEach(id => delete l.rooms[id]);
  l.version = 2;
  l.raids = Array.isArray(l.raids) ? l.raids.slice(0, 30) : [];
  if (!LIVE_PACES[l.settings.chatPace]) l.settings.chatPace = 'normal';
  if (!LIVE_CATEGORIES.includes(l.draft.category)) l.draft.category = LIVE_CATEGORIES[0];
  l.draft.title = String(l.draft.title || defaults.draft.title).slice(0, 100);
  l.history = Array.isArray(l.history) ? l.history.slice(0, 20) : [];
  l.memories = l.memories && typeof l.memories === 'object' && !Array.isArray(l.memories) ? l.memories : {};
  Object.keys(l.memories).slice(LIVE_MEMORY_LIMIT).forEach(id => delete l.memories[id]);
  if (l.active) {
    // A reload/import must never simulate hours of broadcasting in the background.
    l.active.paused = true;
    l.active.lastWall = Date.now();
    l.active.messages = (l.active.messages || []).slice(-150);
    l.active.pending = [];
    l.active.growthAge ??= l.active.elapsed || 0;
    l.active.viralChecked ??= Math.floor(l.active.growthAge / 60);
  }
}

function liveMemory(id) {
  const l = S.live, key = String(id >>> 0);
  if (!l.memories[key]) {
    const entries = Object.values(l.memories);
    if (entries.length >= LIVE_MEMORY_LIMIT) {
      const candidates = entries.filter(m => !l.active || !l.active.regulars.includes(m.id));
      const oldest = candidates.sort((a, b) => Number(!!(a.liveVisits || a.guestChats)) - Number(!!(b.liveVisits || b.guestChats)) || a.rapport - b.rapport || a.seenAt - b.seenAt)[0];
      if (oldest) delete l.memories[oldest.id];
    }
    l.memories[key] = { id: id >>> 0, social: false, liveVisits: 0, liveFollow: false,
      rapport: 0, seenAt: gameNow(), lastSession: null, lastTitle: '', lastHighlight: '' };
  }
  const m = l.memories[key]; m.seenAt = gameNow();
  return m;
}

function rememberSocialNPC(id, post) {
  careerEncounter(id, 'social', String(post?.id || 'hello'));
  if (!S.live) return;
  const m = liveMemory(id);
  m.social = true;
  if (post) { m.socialText = (post.text || 'deinem Beitrag').slice(0, 85); m.socialPost = post.id; }
}

function seedLiveCommunity() {
  // Recover familiar commenters and DM partners from pre-Live save files as well.
  for (const p of S.posts.slice(0, 5)) {
    for (const c of p.cm.slice(-5)) rememberSocialNPC(c[0], p);
  }
  for (const id of Object.keys(S.dms).slice(-10)) rememberSocialNPC(+id);
}

function platformTabs() {
  const live = currentRoute().name === 'live', lobby = currentRoute().name === 'lobby';
  return `<nav class="platform-tabs" aria-label="Plattform wechseln">
    <a href="#/home" class="platform-tab${live || lobby ? '' : ' selected'}" ${live || lobby ? '' : 'aria-current="page"'}><span class="mini-bubble"></span>Bubble</a>
    <a href="#/live" class="platform-tab${live ? ' selected' : ''}" ${live ? 'aria-current="page"' : ''}><span class="live-dot"></span>Bubble Live <span class="platform-status" data-live-status>${S.live.active ? (S.live.active.paused ? 'PAUSE' : 'LIVE') : 'DEIN KANAL'}</span></a><a class="platform-tab lobby-shortcut${lobby ? ' selected' : ''}" href="#/lobby" aria-label="Spieler-Lobby">↔ <span class="lobby-shortcut-label">Lobby</span><i data-lobby-dot></i></a>
  </nav>`;
}

function liveDuration(seconds) {
  const t = Math.floor(seconds || 0);
  return (t >= 3600 ? Math.floor(t / 3600) + ':' : '') + String(Math.floor(t / 60) % 60).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
}

function livePostLink(p) {
  const s = S.live.active, same = s && s.id === p.liveLink.session;
  const ended = S.live.history.some(x => x.id === p.liveLink.session);
  return `<a class="live-post-link" href="#/live" data-go="#/live"><span class="live-dot"></span><span><b>Bubble Live · @${esc(S.me.handle)}</b><small>${same ? (s.paused ? 'Stream pausiert · Zum Kanal' : 'Jetzt live · Im Chat dabei sein') : ended ? 'Stream beendet · Zum Kanal' : 'Stream angekündigt · Zum Kanal'}</small></span><span aria-hidden="true">↗</span></a>`;
}

function liveProfileBadge(a) {
  if (a.me) return `<a class="live-profile-link" href="#/live"><span class="live-dot"></span>Dein Bubble-Live-Kanal <b>${fmt(S.live.followers)} Follower</b> ↗</a>`;
  const m = S.live.memories[a.id];
  const channel = liveDirectory().some(c => c.id === a.id) || S.live.rooms[a.id];
  const link = channel ? `<a class="live-profile-link" href="#/live/watch/${a.id}"><span class="live-dot"></span>Auf Bubble Live zuschauen ↗</a>` : '';
  return link + (m?.liveVisits ? `<div class="live-profile-link"><span class="live-dot"></span><span>${m.liveVisits > 1 ? 'Wiederkehrender Gast' : 'Bekannt aus deinem Livechat'} · ${fmtFull(m.liveVisits)} ${m.liveVisits === 1 ? 'Stream' : 'Streams'}${m.liveFollow ? ' · Folgt dir auf Live' : ''}</span></div>` : m?.guestChats ? '<div class="live-profile-link">Schon im Livechat miteinander gesprochen 💬</div>' : '');
}

function addLiveMessage(text, id = null, type = 'npc', extra = {}) {
  const relation = S.career?.relations[id];
  if (type === 'npc' && relation?.moderator) extra.badge = 'Moderator';
  else if (type === 'npc' && relation?.score >= 12 && S.career.owned.includes('badge')) extra.badge = '🌟 Crew';
  const s = S.live.active; if (!s) return;
  s.messages.push({ key: S.live.nextMessage++, id, text: String(text).slice(0, 500), type, t: gameNow(), ...extra });
  if (s.messages.length > 150) s.messages.splice(0, s.messages.length - 150);
  if (type === 'npc' || type === 'me') s.chatCount++;
  markDirty();
}

function addBridgeComment(p, id, text) {
  // Slot 6 is literal text, so memories cannot rewrite old comments on rerender.
  if (!p || p.cm.length >= 400) return;
  p.cm.push([id, h32(p.id, id, gameNow()), gameNow(), KINDS.indexOf('fan'), null, [], text]);
  p.st.c++;
  rememberSocialNPC(id, p);
  notify({ type: 'comment', key: 'p' + p.id, actors: [id], text, ci: p.cm.length - 1 });
  markDirty();
}

function onSocialPost(p) {
  careerOnPost(p);
  if (!S.live) return;
  const known = Object.values(S.live.memories).filter(m => m.liveVisits || m.guestChats).sort((a, b) => b.seenAt - a.seenAt).slice(0, 3);
  known.forEach((m, i) => {
    const n = npc(m.id), snippet = (m.lastHighlight || '').slice(0, 70);
    let text;
    if (p.liveLink?.kind === 'promotion') text = n.lang === 'en' ? 'Saw your post — see you in the live chat!' : 'Ankündigung gesehen! Bin gleich wieder im Livechat dabei 🙌';
    else if (!m.liveVisits && m.guestChats) text = m.id === m.lastGuestChannel ? `Hey @${S.me.handle}, schön, dass du in meinem Livechat dabei warst! Jetzt sehen wir uns auch auf Bubble 💜` : `Wir haben doch im Livechat bei @${npc(m.lastGuestChannel).handle} geschrieben! Schön, dich auch auf Bubble zu sehen 👋`;
    else if (!m.social) text = n.lang === 'en' ? 'Wait, I know you from Bubble Live! Following you here too.' : 'Oh mein Gott, du bist doch von Bubble Live! Folge dir jetzt auch hier 😍';
    else if (snippet) text = `Bei „${m.lastTitle}“ war ich dabei! Der Moment „${snippet}“ 😂`;
    else text = `Kenne dich aus deinem Stream „${m.lastTitle}“! Wann bist du wieder auf Bubble Live? 💜`;
    addBridgeComment(p, m.id, text);
    if (!isFollower(m.id)) {
      S.extraF.push(m.id);
      if (S.live.active) S.live.active.newSocial++;
      notify({ type: 'follow', actors: [m.id], count: 1, merge: true });
    }
    m.social = true; m.rapport = Math.min(100, m.rapport + 1);
  });
  FEED_CACHE = null;
}

function liveSocialPost(text, sessionId, kind = 'promotion') {
  const det = detectTopics(text);
  const p = { id: S.nextId++, t: gameNow(), text, media: [], card: null, poll: null,
    tags: tagsOf(text), topics: det.topics, kw: det.kw, q: false, liveLink: { session: sessionId, kind } };
  planPost(p); S.posts.unshift(p); onSocialPost(p); FEED_CACHE = null;
  markDirty(); return p;
}

function pickLiveNPC(r) {
  const moderators = Object.values(S.career?.relations || {}).filter(x => x.moderator).map(x => x.id);
  if (moderators.length && r.ch(.15)) return r.pick(moderators);
  const s = S.live.active;
  if (s.regulars.length && r.ch(.62)) return r.pick(s.regulars);
  const known = Object.values(S.live.memories).filter(m => m.social || m.liveVisits || m.guestChats);
  const returning = known.filter(m => m.liveVisits);
  if (returning.length && r.ch(.5)) return r.pick(returning).id;
  if (known.length && r.ch(.65)) return r.pick(known).id;
  if (totalFollowers() && r.ch(s.campaign ? .8 : .35)) {
    if (S.extraF.length && (!S.followers || r.ch(.25))) return r.pick(S.extraF);
    if (S.followers) return followerId(r.i(S.followers));
  }
  return h32(S.seed, s.id, s.chatCount, r.seed(), 'live-discovery');
}

function liveGreeting(id) {
  const s = S.live.active, m = liveMemory(id), n = npc(id);
  const prior = m.liveVisits, wasSocial = m.social || isFollower(id), oldTitle = m.lastTitle;
  m.social = !!wasSocial;
  if (m.lastSession !== s.id) {
    m.liveVisits++; m.lastSession = s.id; m.lastTitle = s.title;
    if (!s.regulars.includes(id) && s.regulars.length < 36) s.regulars.push(id);
  }
  if (prior && oldTitle && oldTitle !== s.title) return n.lang === 'en' ? `Back again! Loved your stream “${oldTitle}”.` : `Wieder da! Bei „${oldTitle}“ war ich auch schon dabei 💜`;
  if (prior) return n.lang === 'en' ? 'The regulars are back 💜' : 'Die Stammcrew ist wieder am Start 💜';
  if (m.guestChats && m.lastGuestChannel != null) return m.id === m.lastGuestChannel ? `Du warst in meinem Chat – jetzt schaue ich bei dir vorbei! Hey @${S.me.handle} 👋` : `Wir kennen uns doch aus dem Chat bei @${npc(m.lastGuestChannel).handle}! Jetzt schaue ich dir zu 💜`;
  if (m.socialText) return `Ich kenne deinen Bubble-Post „${m.socialText.slice(0, 55)}“! Jetzt auch hier 👋`;
  if (wasSocial) return n.lang === 'en' ? 'I follow you on Bubble! Finally catching you live.' : s.campaign ? 'Komme von deinem Bubble-Post rüber! Endlich erwische ich dich live 👋' : 'Omg, ich folge dir auf Bubble! Wusste gar nicht, dass du auch streamst 👀';
  return n.lang === 'en' ? 'Just found your channel. Hi everyone!' : 'Gerade deinen Kanal entdeckt. Hey zusammen! ✨';
}

const LIVE_CHAT_LINES = {
  'Just Chatting': ['Wie war euer Tag so?', 'Genau der gemütliche Stream, den ich gebraucht hab ☕', 'Chat, bin ich die einzige Person mit Snacks?', 'Erzähl mal, was steht diese Woche an?', 'Deine Bubble-Posts und die Streams passen so gut zusammen.'],
  Gaming: ['Chat, glaubt ihr an den nächsten Versuch?', 'Okay, das war knapp 😭', 'Noch eine Runde? 👀', 'GG! Das Timing haha', 'Mit der Community zocken wäre richtig gut.'],
  Musik: ['Diese Stimmung gerade 🎶', 'Chat hat heute Geschmack', 'Was läuft bei euch auf Dauerschleife?', 'Könnte hier den ganzen Abend bleiben 🎧', 'Das wäre ein guter Moment für einen Clip.'],
  Kreativ: ['Der Prozess ist mindestens so spannend wie das Ergebnis.', 'Die Farbkombi! ✨', 'Zeig das Ergebnis später auch auf Bubble!', 'Wie bist du auf die Idee gekommen?', 'Hab jetzt selbst Lust, was zu machen.'],
  Community: ['Die Namen im Chat kenne ich langsam alle 😂', 'Bubble-Crew ist da 🫶', 'Wer ist heute zum ersten Mal dabei?', 'Nächstes Mal wieder zur gleichen Zeit?', 'So schön, euch auch hier zu sehen.']
};

function emitLiveNPC(r, preferredId) {
  const s = S.live.active, id = preferredId ?? pickLiveNPC(r), m = liveMemory(id), n = npc(id);
  const first = m.lastSession !== s.id;
  let text = first ? liveGreeting(id) : n.lang === 'en' ? r.pick(['Love this community 💜', 'What are we doing next?', 'Chat is on fire today', 'Good to see the familiar faces again!']) : r.pick(LIVE_CHAT_LINES[s.category]);
  if (!first && m.rapport > 0 && r.ch(.2)) text = `Danke nochmal fürs Antworten, ${S.me.name.split(' ')[0]} 🫶`;
  if (s.recentLines.includes(text) && !first) return;
  s.recentLines.push(text); if (s.recentLines.length > 8) s.recentLines.shift();
  addLiveMessage(text, id, 'npc', { badge: m.liveVisits > 1 ? 'Stammgast' : m.social ? 'Bubble-Crew' : 'Neu hier' });
  if (!m.liveFollow && S.live.settings.followPercent > 0 && S.live.settings.growthSpeed > 0 && (first || r.ch(.12))) {
    m.liveFollow = true; gainLiveFollowers(1);
    addLiveMessage(`@${n.handle} folgt dir jetzt auf Bubble Live 💜`, null, 'event');
  }
}

function gainLiveFollowers(count) {
  const actual = Math.min(count, 2e9 - S.live.followers);
  S.live.followers += actual; S.live.active.newLive += actual;
}

function tickLive(now = Date.now(), forcedSeconds = 0) {
  tickGuestLive(now, forcedSeconds);
  const l = S.live, s = l && l.active; if (!s) return;
  const raw = now - s.lastWall; s.lastWall = now;
  if (s.paused || (!forcedSeconds && (document.hidden || S.settings.paused || raw <= 0 || raw > 15000))) return;
  const dt = forcedSeconds || Math.min(raw / 1000, 5); s.elapsed += dt;
  const r = RNG(h32(S.seed, s.id, Math.floor(s.elapsed * 10)));
  maybeIncomingRaid(s, r);
  const growthDt = dt * l.settings.growthSpeed / 100;
  s.growthAge = (s.growthAge ?? (s.elapsed - dt)) + growthDt;
  if (s.campaign) s.campaign.growthAge = (s.campaign.growthAge || 0) + growthDt;
  const base = liveBaseAudience();
  const promo = s.campaign ? s.campaign.audience * (1 - Math.exp(-(s.campaign.growthAge || 0) / 55)) : 0;
  const ramp = 1 - Math.exp(-s.growthAge / 35);
  const mood = s.hypeUntil > s.elapsed ? 1.2 : 1;
  const minute = Math.floor(s.growthAge / 60);
  if (minute > (s.viralChecked || 0)) {
    s.viralChecked = minute;
    if (r.f() * 100 < l.settings.viralChance) { s.viralUntil = s.elapsed + 45; s.viralEvents = (s.viralEvents || 0) + 1; addLiveMessage('Dein Stream wird gerade auf Bubble Live entdeckt! Neue Zuschauer kommen dazu 🔥', null, 'event'); }
  }
  const viral = (s.viralUntil || 0) > s.elapsed ? 1.8 : 1;
  const raid = (s.raidAudience || 0) * Math.exp(-Math.max(0, s.elapsed - (s.raidAt || 0)) / 300);
  const target = l.settings.viewerOverride ?? Math.min(2e9, (base * ramp + promo + raid) * mood * viral * (.96 + .07 * Math.sin(s.elapsed / 17)));
  s.viewers = Math.max(0, s.viewers + (target - s.viewers) * (1 - Math.exp(-growthDt / 8)));
  s.peak = Math.max(s.peak, Math.round(s.viewers));
  s.viewerSeconds += s.viewers * dt;
  careerLiveTick(s, dt); careerStoryStream(s, dt); careerSharedTick(s, dt);
  s.promoViewers = Math.min(Math.round(s.viewers), Math.round(promo));
  // Conversion is tied to actual simulated viewing time, never to background time.
  s.followCredit += s.viewers * growthDt / 60 * l.settings.followPercent / 100;
  const follows = Math.floor(s.followCredit);
  if (follows) { gainLiveFollowers(follows); s.followCredit -= follows; }
  const discoverShare = clamp(base / Math.max(1, base + promo), .02, 1);
  s.socialCredit += s.viewers * growthDt / 60 * discoverShare * l.settings.backPercent / 100;
  const social = Math.min(Math.floor(s.socialCredit), Math.max(0, 2e9 - totalFollowers()));
  if (social) { S.followers += social; s.newSocial += social; s.socialCredit -= social; }
  if (Math.round(s.viewers) > 0 && s.elapsed * 1000 >= s.nextChat) {
    emitLiveNPC(r);
    s.nextChat = s.elapsed * 1000 + LIVE_PACES[l.settings.chatPace] * (.8 + r.f() * .4);
  }
  const due = s.pending.filter(p => p.at <= s.elapsed);
  s.pending = s.pending.filter(p => p.at > s.elapsed);
  for (const job of due) {
    const m = liveMemory(job.id);
    if (m.lastSession !== s.id) liveGreeting(job.id);
    m.rapport = Math.min(100, m.rapport + 1);
    addLiveMessage(job.text, job.id, 'npc', { badge: m.liveVisits > 1 ? 'Stammgast' : m.social ? 'Bubble-Crew' : 'Neu hier' });
  }
  if (s.poll && !s.poll.closed) {
    const progress = clamp(1 - (s.poll.endsAt - s.elapsed) / 30, 0, 1);
    const votes = Math.floor(s.peak * .65 * progress);
    s.poll.votes[0] = Math.floor(votes * s.poll.weights[0]);
    s.poll.votes[1] = votes - s.poll.votes[0];
    if (s.elapsed >= s.poll.endsAt) closeLivePoll();
  }
  markDirty();
}

function liveReadDraft() {
  const title = $('#live-title'), category = $('#live-category');
  if (title) S.live.draft.title = title.value.trim().slice(0, 100);
  if (category && LIVE_CATEGORIES.includes(category.value)) S.live.draft.category = category.value;
}

function startLive() {
  if (S.live.active) return;
  liveReadDraft();
  if (!S.live.draft.title) { note('Gib deinem Stream zuerst einen Titel.'); $('#live-title')?.focus(); return; }
  if (S.settings.paused) { note('Die Simulation ist im Studio pausiert. Setze sie dort zuerst fort.'); return; }
  seedLiveCommunity();
  const l = S.live, id = l.nextSession++;
  l.active = { id, title: l.draft.title, category: l.draft.category, started: gameNow(), lastWall: Date.now(), growthAge: 0, viralChecked: 0,
    elapsed: 0, viewers: 1, peak: 1, viewerSeconds: 0, newLive: 0, newSocial: 0, promoViewers: 0,
    followCredit: 0, socialCredit: 0, nextChat: 1200, paused: false, messages: [], chatCount: 0,
    pending: [], regulars: [], highlights: [], recentLines: [], hypeUntil: 0, poll: null,
    campaign: l.campaign ? { ...l.campaign, at: 0 } : null };
  l.campaign = null;
  addLiveMessage('Du bist live. Deine Bubble-Community kann jetzt dazukommen.', null, 'event');
  const r = RNG(h32(S.seed, id, 'opening'));
  const returning = Object.values(l.memories).filter(m => m.liveVisits > 0);
  const social = Object.values(l.memories).filter(m => m.social || m.guestChats);
  if (l.settings.viewerOverride === 0) l.active.viewers = 0;
  else emitLiveNPC(r, returning.length ? r.pick(returning).id : social.length ? r.pick(social).id : undefined);
  markDirty(); save(); renderRoute(true);
}

function promoteLive() {
  const l = S.live, s = l.active;
  if ((s && s.campaign) || (!s && l.campaign)) return;
  liveReadDraft();
  const title = s ? s.title : l.draft.title;
  if (!title) { note('Gib deinem Stream zuerst einen Titel.'); return; }
  const id = s ? s.id : l.nextSession;
  const text = s ? `Ich bin jetzt auf Bubble Live! 💜\n${title}\nKommt in den Chat und sagt Hallo! #BubbleLive` : `Mein nächster Stream auf Bubble Live: ${title} 💜\nIch sage im Livechat Hallo – kommt dazu! #BubbleLive`;
  const p = liveSocialPost(text, id);
  const campaign = { postId: p.id, audience: Math.floor(totalFollowers() * l.settings.promoPercent / 100),
    followers: totalFollowers(), percent: l.settings.promoPercent, at: s ? s.elapsed : 0 };
  if (s) {
    s.campaign = campaign;
    addLiveMessage('Dein Stream ist auf Bubble angekündigt. Die ersten Leute kommen nach und nach rüber.', null, 'event');
  } else l.campaign = campaign;
  markDirty(); save(); renderRoute(true); note('Stream-Ankündigung auf Bubble gepostet');
}

function liveResponse(text, id, r) {
  const m = liveMemory(id), n = npc(id), en = n.lang === 'en';
  if (/bubble|post|follower/i.test(text)) return m.social ? (en ? 'I know your Bubble account — same handle, same crew!' : m.socialText ? `Deinen Post „${m.socialText.slice(0, 55)}“ hab ich gesehen! Deshalb bin ich hier 🫶` : 'Ich folge dir schon auf Bubble! Gleicher Name, gleiche Crew 🫶') : (en ? 'Found you here on Live first. Checking out your Bubble profile too!' : 'Ich hab dich zuerst hier auf Live entdeckt! Schaue auch auf deinem Bubble-Profil vorbei 👀');
  if (/hallo|hey|hi\b|moin|willkommen/i.test(text)) return en ? `Hey ${S.me.name.split(' ')[0]}! 👋` : `Heeey ${S.me.name.split(' ')[0]}! Schön, dass du da bist 👋`;
  if (/wie geht|wie war|tag\b|wochenende/i.test(text)) return en ? 'Long day, happy to hang out here now.' : r.pick(['Langer Tag, jetzt wird hier entspannt ☕', 'Gut! Hab mich schon auf den Stream gefreut.', 'Ziemlich chaotisch heute 😂 Und bei dir?']);
  if (/danke|lieb|feier euch/i.test(text)) return en ? 'Thanks for hanging out with us 💜' : 'Danke DIR für den Stream 💜';
  if (/spiel|game|zock|runde/i.test(text)) return en ? 'One more round! Chat believes in you.' : r.pick(['Noch eine Runde! Chat glaubt an dich 🎮', 'Lass die Community entscheiden!', 'Ich bin fürs gemeinsame Zocken 👀']);
  if (/tschüss|bye|gute nacht|bis morgen/i.test(text)) return en ? 'See you next stream! 💜' : 'Bis zum nächsten Stream! Wir sehen uns auf Bubble 💜';
  if (/\?/.test(text)) return en ? 'I vote yes! What does the rest of chat think?' : r.pick(['Ich wäre dabei! Was sagt der Rest vom Chat?', 'Gute Frage! Mach eine Umfrage, dann stimmen wir ab 👀', 'Meine Stimme hast du 😄']);
  return en ? `About “${text.slice(0, 75)}” — chat is listening 👀` : `„${text.slice(0, 75)}“ — ${r.pick(['fühl ich 😂', 'erzähl mehr, jetzt bin ich neugierig 👀', 'genau dafür bin ich hier 🙌'])}`;
}

function sendLiveChat() {
  const s = S.live.active, input = $('#live-message');
  if (!s || s.paused || S.settings.paused || !input) return;
  const text = input.value.trim().slice(0, 400); if (!text) return;
  addLiveMessage(text, 'me', 'me'); input.value = ''; s.chatDraft = '';
  const r = RNG(h32(S.seed, s.id, s.chatCount));
  const mention = /^@([\w.]+)/.exec(text);
  const mentioned = mention && s.regulars.find(id => npc(id).handle.toLowerCase() === mention[1].toLowerCase());
  const ids = new Set(mentioned != null ? [mentioned] : []);
  for (let i = 0; i < 8 && ids.size < 2; i++) ids.add(pickLiveNPC(r));
  [...ids].forEach((id, i) => {
    careerEncounter(id, 'reply', text);
    if (s.pending.length < 12) s.pending.push({ id, text: liveResponse(text, id, r), at: s.elapsed + 1.5 + i * 2 });
  });
  refreshLiveUI(); lobbyPulse(true); input.focus();
}

function liveMoment(kind) {
  const s = S.live.active; if (!s || s.paused || S.settings.paused) return;
  if (s.elapsed < (s.nextMoment || 0)) { note('Lass dem Chat kurz Zeit zum Reagieren.'); return; }
  const titles = { hype: 'Die Community feiert gemeinsam', story: 'Eine Story aus deinem Alltag', win: 'Ein epischer Moment im Stream' };
  const title = titles[kind]; if (!title) return;
  s.nextMoment = s.elapsed + 10; s.hypeUntil = s.elapsed + 35;
  s.highlights.push(title); if (s.highlights.length > 6) s.highlights.shift();
  addLiveMessage(title, 'me', 'moment');
  const r = RNG(h32(s.id, s.elapsed, kind));
  for (let i = 0; i < 3; i++) {
    const id = pickLiveNPC(r), m = liveMemory(id);
    m.lastHighlight = title;
    s.pending.push({ id, at: s.elapsed + 1 + i * 2, text: r.pick(kind === 'story' ? ['Das musst du auch auf Bubble erzählen 😂', 'Okay, jetzt verstehe ich deinen letzten Post!', 'Chat hört zu 👀'] : ['DAS war ein Clip-Moment 🔥', 'Ich war dabei!!', 'W chat 💜💜💜', 'Das werde ich morgen noch feiern 😂']) });
  }
  markDirty(); refreshLiveUI();
}

function openLivePoll() {
  const s = S.live.active; if (!s || s.paused || S.settings.paused) return;
  if (s.poll && !s.poll.closed) { note('Es läuft bereits eine Umfrage.'); return; }
  openModal('Chat-Umfrage', `<div class="form"><label>Frage<input class="field" id="live-poll-question" maxlength="100" value="Was machen wir als Nächstes?"></label><label>Option 1<input class="field" id="live-poll-a" maxlength="45" value="Noch eine Runde"></label><label>Option 2<input class="field" id="live-poll-b" maxlength="45" value="Mit dem Chat reden"></label><p class="muted">Deine Zuschauer stimmen 30 Sekunden lang ab.</p></div>`, '<button class="btn ghost" data-act="close-modal">Abbrechen</button><button class="btn acc" data-act="live-poll-start">Umfrage starten</button>');
}

function startLivePoll() {
  const s = S.live.active; if (!s || s.paused || S.settings.paused || (s.poll && !s.poll.closed)) return;
  const question = $('#live-poll-question').value.trim(), opts = [$('#live-poll-a').value.trim(), $('#live-poll-b').value.trim()];
  if (!question || opts.some(x => !x) || opts[0].toLowerCase() === opts[1].toLowerCase()) { note('Eine Frage und zwei unterschiedliche Antworten sind nötig.'); return; }
  const weight = .3 + u01(s.id, s.chatCount) * .4;
  s.poll = { question: question.slice(0, 100), opts: opts.map(x => x.slice(0, 45)), votes: [0, 0], weights: [weight, 1 - weight], endsAt: s.elapsed + 30, closed: false };
  addLiveMessage('Umfrage: ' + question, null, 'event'); closeModal(); refreshLiveUI();
}

function closeLivePoll() {
  const s = S.live.active, p = s && s.poll; if (!p || p.closed) return;
  p.closed = true;
  const total = p.votes[0] + p.votes[1], tie = p.votes[0] === p.votes[1];
  addLiveMessage(!total ? 'Umfrage beendet: Diesmal gab es keine Stimmen.' : tie ? 'Umfrage beendet: Unentschieden!' : `Der Chat hat entschieden: ${p.opts[p.votes[0] > p.votes[1] ? 0 : 1]} (${fmtFull(total)} Stimmen)`, null, 'event');
}

function finishLive() {
  const l = S.live, s = l.active; if (!s) return;
  tickLive(); closeLivePoll();
  const recap = { id: s.id, title: s.title, category: s.category, started: s.started, ended: gameNow(),
    elapsed: s.elapsed, peak: s.peak, average: Math.round(s.viewerSeconds / Math.max(1, s.elapsed)),
    newLive: s.newLive, newSocial: s.newSocial, chatCount: s.chatCount, highlights: s.highlights,
    promoViewers: s.promoViewers, regulars: s.regulars.slice(), shared: false, incomingRaids: s.incomingRaids || 0, hostedChannel: s.hosting ?? null };
  for (const id of s.regulars) {
    const m = liveMemory(id); m.lastTitle = s.title;
    if (s.highlights.length) m.lastHighlight = s.highlights[s.highlights.length - 1];
  }
  l.history.unshift(recap); l.history = l.history.slice(0, 20); l.active = null;
  // NPCs return to an existing social post without inventing posts for the player.
  const p = S.posts.find(p => p.liveLink?.session === s.id) || S.posts[0];
  if (p) s.regulars.slice(0, 2).forEach(id => addBridgeComment(p, id, `War gerade bei „${s.title}“ auf Bubble Live dabei! ${s.highlights.length ? 'Der Moment „' + s.highlights[s.highlights.length - 1] + '“ war mein Highlight 😂' : 'Wir sehen uns beim nächsten Stream 💜'}`));
  markDirty(); save(); renderRoute(true); note('Stream beendet · Deine Community erinnert sich daran');
}

function shareLiveRecap() {
  const recap = S.live.history[0]; if (!recap || recap.shared) return;
  recap.shared = true;
  const p = liveSocialPost(`Danke für „${recap.title}“ auf Bubble Live! 💜\n${fmtFull(recap.peak)} Zuschauer gleichzeitig und ${fmtFull(recap.newLive)} neue Live-Follower.${recap.highlights.length ? '\nMein Highlight: ' + recap.highlights[recap.highlights.length - 1] : ''}\nWer war dabei? #BubbleLive`, recap.id, 'recap');
  markDirty(); save(); location.hash = '#/post/p' + p.id;
}

function liveChatHTML(m) {
  if (m.type === 'player') return lobbyLiveMessageHTML(m);
  if (m.type === 'event') return `<div class="live-chat-event" data-message="${m.key}">${esc(m.text)}</div>`;
  const me = m.type === 'me' || m.type === 'moment', n = me ? meObj() : npc(m.id);
  return `<div class="live-chat-line${me ? ' from-me' : ''}" data-message="${m.key}"><img class="av xs" src="${avatarSrc(n)}" alt=""><div><a href="${profHref(n)}" class="live-chat-name" style="--name-color:${me ? '#cfb7ff' : ['#ffa8bc', '#8ae2ce', '#afbdff', '#ffd18a'][n.id % 4]}">${esc(n.handle)}</a>${me ? '<span class="live-chat-badge">Streamer</span>' : m.badge ? `<span class="live-chat-badge">${esc(m.badge)}</span>` : ''}<span class="live-chat-text">${esc(m.text)}</span></div>${!me ? `<button class="live-reply" data-act="live-reply" data-id="${m.id}" aria-label="${esc(n.handle)} antworten">↩</button>` : ''}</div>`;
}

function livePollHTML() {
  const s = S.live.active, p = s && s.poll; if (!p) return '';
  const sum = p.votes.reduce((a, b) => a + b, 0);
  return `<div class="live-poll"><small>${p.closed ? 'ERGEBNIS' : `CHAT-UMFRAGE · ${Math.max(0, Math.ceil(p.endsAt - s.elapsed))} s`}</small><b>${esc(p.question)}</b>${p.opts.map((opt, i) => `<div class="live-poll-option"><i style="width:${sum ? p.votes[i] / sum * 100 : 0}%"></i><span>${esc(opt)}</span><strong>${sum ? Math.round(p.votes[i] / sum * 100) : 0}%</strong></div>`).join('')}<small>${fmtFull(sum)} Stimmen</small></div>`;
}

function liveRecapHTML() {
  const h = S.live.history[0]; if (!h) return '';
  return `<section class="live-card live-recap"><div class="live-eyebrow">DEIN LETZTER STREAM</div><h3>${esc(h.title)}</h3><div class="live-recap-stats"><span><b>${liveDuration(h.elapsed)}</b>Laufzeit</span><span><b>${fmt(h.peak)}</b>Zuschauerrekord</span><span><b>+${fmt(h.newLive)}</b>Live-Follower</span><span><b>+${fmt(h.newSocial)}</b>Bubble-Follower</span></div><p class="muted">Ø ${fmt(h.average)} Zuschauer · ${fmtFull(h.chatCount)} Chatnachrichten${h.highlights.length ? ' · ' + esc(h.highlights[h.highlights.length - 1]) : ''}</p><button class="btn ghost sm" data-act="live-share" ${h.shared ? 'disabled' : ''}>${h.shared ? 'Rückblick auf Bubble geteilt' : 'Rückblick auf Bubble teilen'}</button></section>`;
}

function liveCommunityHTML() {
  const people = Object.values(S.live.memories).filter(m => m.liveVisits).sort((a, b) => b.liveVisits - a.liveVisits || b.rapport - a.rapport).slice(0, 5);
  return `<section class="live-card"><div class="live-section-title"><h3>Eine Community. Zwei Bühnen.</h3><span>↔</span></div><p class="muted">Dieselben Menschen, dieselben Erinnerungen. Deine Stammgäste erkennen dich auch auf Bubble wieder.</p>${people.length ? people.map(m => { const n = npc(m.id); return `<a class="live-person" href="#/u/${n.id}"><img class="av s" src="${avatarSrc(n)}" alt=""><span><b>${esc(n.name)}</b><small>${m.social ? 'Bubble + Live' : 'Auf Live entdeckt'} · ${m.liveVisits} ${m.liveVisits === 1 ? 'Stream' : 'Streams'}${m.rapport ? ' · Im Gespräch mit dir' : ''}</small></span><span class="live-person-arrow">↗</span></a>`; }).join('') : '<div class="live-community-empty"><span>◎</span>Starte deinen ersten Stream und lerne deine Chat-Crew kennen.</div>'}</section>`;
}

function refreshLiveUI() {
  careerRefreshLive();
  if (!S?.live) return;
  const l = S.live, s = l.active, paused = s && (s.paused || S.settings.paused);
  $$('[data-live-status]').forEach(e => e.textContent = s ? paused ? 'PAUSE' : 'LIVE' : 'DEIN KANAL');
  if (currentRoute().name !== 'live') return;
  if (currentRoute().a === 'watch') { refreshGuestUI(); return; }
  if (currentRoute().a === 'growth') { refreshGrowthPreview(); return; }
  if (['discover', 'trends', 'following'].includes(currentRoute().a)) { refreshLiveDirectory(); return; }
  const vals = { followers: fmtFull(l.followers), viewers: fmt(Math.round(s?.viewers || 0)), elapsed: liveDuration(s?.elapsed), newLive: '+' + fmt(s?.newLive || 0), promoViewers: fmt(s?.promoViewers || 0) };
  $$('[data-live-metric]').forEach(e => { e.textContent = vals[e.dataset.liveMetric]; });
  const estimate = $('[data-live-promo-estimate]'); if (estimate) estimate.textContent = fmtFull(Math.floor(totalFollowers() * l.settings.promoPercent / 100));
  const stage = $('.live-stage'); if (stage) stage.classList.toggle('stream-paused', !!paused);
  const support = $('#live-support-slot');
  if (support && s) { const key = `${s.hosting}:${s.lastRaid?.hostId}:${s.lastRaid?.count}`; if (support.dataset.version !== key) { support.innerHTML = liveHostingHTML(); support.dataset.version = key; } }
  if (!s) return;
  const log = $('#live-chat-log');
  if (log && log.lastElementChild?.dataset.message !== String(s.messages.at(-1)?.key)) {
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 65;
    const lastKey = Number(log.lastElementChild?.dataset.message || 0);
    const fresh = s.messages.filter(m => m.key > lastKey);
    log.insertAdjacentHTML('beforeend', fresh.map(liveChatHTML).join(''));
    while (log.children.length > 150) log.firstElementChild.remove();
    if (atBottom) { log.scrollTop = log.scrollHeight; $('#live-catchup').hidden = true; }
    else $('#live-catchup').hidden = false;
  }
  const poll = $('#live-poll-slot'); if (poll) { const html = livePollHTML(); if (poll.innerHTML !== html) poll.innerHTML = html; }
}

function npcLiveStats(channel, now = gameNow()) {
  const base = Math.max(4, Math.min(150000, Math.floor(npcFollowers(npc(channel.id), now) * (.012 + u01(channel.id, 'live-rate') * .04))));
  const wave = 1 + .12 * Math.sin(now / 37000 + channel.id % 40) + .06 * Math.sin(now / 11000 + channel.id % 10);
  const raid = S.live.rooms[channel.id]?.raid;
  const extra = raid ? raid.count * Math.exp(-Math.max(0, now - raid.at) / 300000) : 0;
  const hosting = S.live.active?.hosting === channel.id ? S.live.active.viewers * .8 : 0;
  return { viewers: Math.max(1, Math.round(base * wave + extra + hosting)), followers: Math.max(10, Math.floor(npcFollowers(npc(channel.id), now) * (.16 + u01(channel.id, 'live-follow') * .3))), momentum: 1 + u01(channel.id, Math.floor(now / (15 * 60e3)), 'hot') * 1.5 };
}

  if (rooms.length >= 24) { const oldest = rooms.sort((a, b) => a.lastVisit - b.lastVisit)[0]; delete S.live.rooms[oldest.id]; }
  const room = { id, messages: [], pending: [], crowd: Array.from({ length: 10 }, (_, i) => h32(S.seed, id, i, 'live-crowd')), elapsed: 0, lastWall: Date.now(), nextChat: 1, nextHost: 12, visits: 0, sent: 0, draft: '', lastVisit: gameNow() };
  S.live.rooms[id] = room;
  const c = liveChannel(id), r = RNG(h32(id, 'welcome-chat'));
  guestMessage(room, 'Willkommen im Livechat. Schreib etwas – der Kanal und die Community reagieren auf dich.', null, 'event');
  for (let i = 0; i < 5; i++) guestMessage(room, r.pick(LIVE_CHAT_LINES[c.category]), room.crowd[i]);
  guestMessage(room, `Schön, dass ihr da seid! Heute: ${c.title}`, id, 'host');
  return room;
}

function joinGuestRoom(id) {
  const room = guestRoom(id);
  if (LIVE_WATCHING !== id) {
    LIVE_WATCHING = id; room.visits++; room.lastVisit = gameNow(); room.lastWall = Date.now();
    const host = npc(id), m = S.live.memories[id];
    const text = room.visits > 1 ? `Willkommen zurück, @${S.me.handle}! Schön, dich wieder im Chat zu sehen 💜` : m?.social || isFollower(id) ? `Hey @${S.me.handle}, dich kenne ich von Bubble! Schön, dass du hier vorbeischaust 👋` : `Hey @${S.me.handle}, willkommen bei uns! Mach es dir gemütlich 👋`;
    guestMessage(room, text, host.id, 'host');
  }
  return room;
}

function rememberGuestConversation(id, channelId) {
  careerEncounter(id, 'guest', String(channelId) + ':' + Math.floor(gameNow() / DAY));
  const m = liveMemory(id);
  m.guestChats = Math.min(1000, (m.guestChats || 0) + 1); m.lastGuestChannel = channelId;
  m.rapport = Math.min(100, m.rapport + 1);
  return m;
}

function guestResponse(text, id, channel, host, seed) {
  const r = RNG(seed), n = npc(id), handle = '@' + S.me.handle;
  const content = text.replace(/^@[\w.]+\s*/, '').trim();
  if (/raid|hosten|unterstütz/i.test(content)) return host ? `${handle}, danke für den Support! So lernen sich unsere Communities kennen 💜` : `${handle} mit dem Support! Liebe an deine Community 💜`;
  if (/bubble|post|follower/i.test(content)) return host ? (isFollower(id) || S.live.memories[id]?.social ? `${handle}, klar kenne ich dich von Bubble! Deine Posts landen bei mir im Feed.` : `${handle}, dein Bubble-Profil schaue ich mir nach dem Stream an! Schön, dass du hier bist.`) : `${handle}, bist du auch auf Bubble unterwegs? Gleicher Handle? Ich schau mal rüber 👀`;
  if (/wie geht|wie war|tag\b|wochenende/i.test(content)) return host ? `${handle}, langer Tag, aber gerade richtig gute Laune dank dem Chat! Und bei dir?` : `${handle}, bei mir ist jetzt Feierabend. Genau die richtige Runde hier ☕`;
  if (/was spiel|welches spiel|zock|game|runde/i.test(content)) return host ? (channel.category === 'Gaming' ? `${handle}, heute Community-Runden! Nach dieser Runde entscheidet der Chat, wie es weitergeht 🎮` : `${handle}, gerade ist ${channel.category} angesagt. Gaming können wir für den nächsten Stream vormerken!`) : r.pick([`${handle}, ich bin für eine Community-Runde!`, `${handle}, frag nach dem nächsten Versuch nochmal, hier ist gerade Chaos 😂`]);
  if (/musik|song|beat|hör/i.test(content)) return host ? `${handle}, ich sammle gerade Musiktipps aus dem Chat. Welchen Sound feierst du? 🎧` : `${handle}, schreib deinen Tipp rein! Ich suche auch neue Musik.`;
  if (/woher|wo wohn|stadt/i.test(content)) return `${handle}, Grüße aus ${n.city}! Und wo schaut ihr zu?`;
  if (/hallo|hey|hi\b|moin|hello/i.test(content)) return host ? `${handle}, heeey! Schön, dass du reinschaust. Wie geht's dir? 👋` : r.pick([`Willkommen ${handle}! Snacks sind links 🍿`, `Hey ${handle}! Mach's dir gemütlich 💜`, `${handle} ist da! Ich glaube, wir kennen uns von Bubble 👀`]);
  if (/danke|lieb|feier|cool|nice/i.test(content)) return host ? `${handle}, danke dir! Macht mit euch im Chat auch einfach Spaß 🫶` : `${handle}, sehe ich genauso! Genau deshalb hängen wir hier ab.`;
  if (/tschüss|bye|gute nacht|bis morgen/i.test(content)) return host ? `Bis bald ${handle}! Danke fürs Vorbeischauen 💜` : `Mach's gut ${handle}, bis zum nächsten Stream!`;
  if (/\?/.test(content)) return host ? `${handle}, zu „${content.slice(0, 90)}“: Ich würde es ausprobieren. Was sagt der Chat dazu?` : `${handle}, gute Frage! ${r.pick(['Ich wäre dafür 👀', 'Kommt für mich auf die Situation an.', 'Das sollten wir als Community abstimmen.'])}`;
  return host ? `${handle}, „${content.slice(0, 85)}“ – ${r.pick(['da würde ich gern mehr zu hören. Erzähl!', 'das fühl ich. Ging mir letztens ähnlich!', 'spannender Gedanke! Chat, wie seht ihr das?'])}` : `${handle}, ${r.pick(['fühl ich 😂', 'genau das wollte ich auch schreiben!', 'wie bist du darauf gekommen? 👀'])}`;
}

function sendGuestChat() {
  const route = currentRoute(), id = +route.b, input = $('#guest-message');
  if (route.name !== 'live' || route.a !== 'watch' || !validLiveHostId(id) || !input || S.settings.paused) return;
  const text = input.value.trim().slice(0, 400); if (!text) return;
  const room = guestRoom(id); if (room.pending.length > 21) { note('Der Chat antwortet noch. Lass der Runde kurz Zeit.'); return; }
  const c = liveChannel(id), seed = h32(id, room.sent, text), r = RNG(seed);
  guestMessage(room, text, 'me', 'me'); room.sent++; room.draft = ''; input.value = '';
  const mention = /^@([\w.]+)/.exec(text);
  const named = mention && room.crowd.find(n => npc(n).handle.toLowerCase() === mention[1].toLowerCase());
  const guests = [named ?? r.pick(room.crowd)];
  guests.push(r.pick(room.crowd.filter(n => n !== guests[0])));
  room.pending.push({ id, type: 'host', text: guestResponse(text, id, c, true, seed), at: room.elapsed + 2 });
  guests.forEach((guest, i) => room.pending.push({ id: guest, type: 'npc', text: guestResponse(text, guest, c, false, h32(seed, i)), at: room.elapsed + 1 + i * 2.5 }));
  rememberGuestConversation(id, id); guests.forEach(guest => rememberGuestConversation(guest, id));
  markDirty(); refreshGuestUI(); input.focus();
}

function tickGuestLive(now, forcedSeconds = 0) {
  const route = currentRoute();
  if (!S?.live || route.name !== 'live' || route.a !== 'watch' || LIVE_WATCHING !== +route.b) { LIVE_WATCHING = null; return; }
  const room = S.live.rooms[LIVE_WATCHING]; if (!room) return;
  const raw = now - room.lastWall; room.lastWall = now;
  if (!forcedSeconds && (document.hidden || S.settings.paused || raw <= 0 || raw > 15000)) return;
  room.elapsed += forcedSeconds || Math.min(5, raw / 1000);
  const c = liveChannel(room.id), r = RNG(h32(room.id, Math.floor(room.elapsed * 10), room.messages.at(-1)?.key));
  if (room.elapsed >= room.nextChat) {
    const lines = LIVE_CHAT_LINES[c.category], previous = room.messages.slice(-5).map(m => m.text);
    const text = r.pick(lines.filter(line => !previous.includes(line)).concat(['💜💜', 'Chat ist heute gut drauf 😂', 'Lurke gerade, aber bin dabei 👀']));
    guestMessage(room, text, r.pick(room.crowd));
    room.nextChat = room.elapsed + LIVE_PACES[S.live.settings.chatPace] / 1000 * (.65 + r.f() * .4);
  }
  if (room.elapsed >= room.nextHost) {
    guestMessage(room, r.pick([`Chat, wie läuft euer Tag?`, `Wer ist heute zum ersten Mal hier? Schön, dass ihr dabei seid!`, `Zum Thema ${c.category}: Was sollen wir als Nächstes machen?`, 'Danke, dass ihr hier so eine gemütliche Runde draus macht 💜']), room.id, 'host');
    room.nextHost = room.elapsed + 15 + r.f() * 8;
  }
  const due = room.pending.filter(job => job.at <= room.elapsed);
  room.pending = room.pending.filter(job => job.at > room.elapsed);
  due.forEach(job => guestMessage(room, job.text, job.id, job.type, { reply: true }));
  markDirty();
}
