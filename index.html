function refreshGuestUI() {
  const route = currentRoute(), room = S.live.rooms[+route.b]; if (route.a !== 'watch' || !room) return;
  const viewers = $('#guest-viewers'); if (viewers) viewers.textContent = fmt(npcLiveStats(liveChannel(room.id)).viewers);
  const log = $('#guest-chat-log'); if (!log) return;
  const last = Number(log.lastElementChild?.dataset.message || 0), fresh = room.messages.filter(m => m.key > last);
  if (fresh.length) {
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 65;
    log.insertAdjacentHTML('beforeend', fresh.map(guestChatHTML).join(''));
    while (log.children.length > 100) log.firstElementChild.remove();
    if (atBottom) log.scrollTop = log.scrollHeight;
    $('#guest-catchup').hidden = atBottom;
  }
  const status = $('#guest-reply-status'); if (status) status.textContent = room.pending.length ? 'Der Chat antwortet gleich …' : 'Streamer und Community lesen mit';
}

function recordRaid(type, host, count, target = null) {
  S.live.raids.unshift({ type, host, target, count, t: gameNow() }); S.live.raids = S.live.raids.slice(0, 30); markDirty();
}

function maybeIncomingRaid(s, r) {
  const minute = Math.floor(s.elapsed / 60);
  if (minute <= (s.raidChecked || 0)) return;
  s.raidChecked = minute;
  if (!S.live.settings.growthSpeed || r.f() * 100 >= S.live.settings.raidChance) return;
  const pool = liveDirectory().filter(c => c.id !== s.hosting), c = r.pick(pool);
  const size = Math.max(1, Math.round(Math.min(Math.max(5, s.viewers * (.2 + r.f() * .5)), npcLiveStats(c).viewers * .7) * S.live.settings.raidScale / 100));
  receiveLiveRaid(c.id, size);
}

function receiveLiveRaid(hostId, count) {
  const s = S.live.active; if (!s || s.paused || (S.settings.paused && !ADVANCING_WORLD) || !validLiveHostId(hostId)) return;
  count = clamp(Math.floor(count), 1, 2e9); if (!Number.isFinite(count)) return;
  const host = npc(hostId);
  s.raidAudience = (s.raidAudience || 0) * Math.exp(-Math.max(0, s.elapsed - (s.raidAt || 0)) / 300) + count; s.raidAt = s.elapsed;
  s.lastRaid = { hostId, count }; s.incomingRaids = (s.incomingRaids || 0) + 1;
  recordRaid('incoming', hostId, count);
  addLiveMessage(`RAID! @${host.handle} bringt ${fmtFull(count)} Zuschauer mit 💜`, null, 'event');
  liveGreeting(hostId);
  addLiveMessage(`Hey @${S.me.handle}, ich bringe meine Community vorbei! Macht es euch hier gemütlich 💜`, hostId, 'npc', { badge: 'Streamer · Raid' });
  for (let i = 0; i < Math.min(3, count); i++) {
    const id = h32(S.seed, hostId, i, 'live-crowd'); liveGreeting(id);
    addLiveMessage(`Komme mit dem Raid von @${host.handle}! Hallo neue Bubble 👋`, id, 'npc', { badge: 'Raid-Crew' });
  }
  markDirty();
}

Object.assign(ACT, {

<script>
// Bundled from bubble-world.js
"use strict";

// Game dates move together; transport time and browser timers remain wall time.
let ADVANCING_WORLD = false;
function gameNow() { return Date.now() + (S?.timeOffset || 0); }
function migrateWorld(st) {
  st.timeOffset = Math.max(0, Number(st.timeOffset) || 0);
  const now = Date.now() + st.timeOffset;
  if (!Array.isArray(st.npcTimeline) || !st.npcTimeline.length) {
    // Preserve every date in an existing save; only future publishing speeds up.
    st.npcTimeline = [{ at: now - 1, virtual: now - 1, rate: 1 }, { at: now, virtual: now, rate: (st.settings?.posting || 200) / 100 }];
  }
}
function toNpcTime(t) {
  const timeline = S?.npcTimeline; if (!timeline?.length) return t;
  const segment = timeline.findLast(s => s.at <= t) || timeline[0];
  return segment.virtual + (t - segment.at) * segment.rate;
}
function fromNpcTime(t) {
  const timeline = S?.npcTimeline; if (!timeline?.length) return t;
  const segment = timeline.findLast(s => s.virtual <= t) || timeline[0];
  return segment.at + (t - segment.virtual) / segment.rate;
}
function setNpcPostingRate(rate) {
  const at = gameNow(), virtual = toNpcTime(at);
  rate = clamp(Number(rate) || 2, .25, 10);
  if (S.npcTimeline.at(-1).rate !== rate) S.npcTimeline.push({ at, virtual, rate });
  NP_CACHE.clear(); FEED = FEED_CACHE = null;
}
function worldClockLabel() {
  return `Spielzeit: ${new Date(gameNow()).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' })} · insgesamt ${fmtFull(Math.floor((S.timeOffset || 0) / HOUR))} Stunden vorgespult`;
}
async function advanceWorld(hours) {
  hours = clamp(Number(hours) || 0, 0, 168);
  if (!S || !hours || ADVANCING_WORLD) return;
  ADVANCING_WORLD = true;
  const state = S, originalOffset = S.timeOffset, steps = Math.min(720, Math.max(1, Math.ceil(hours * 12)));
  const dh = hours / steps, events = { likes: 0, comments: 0, follows: 0, reposts: 0 };
  const toasts = S.settings.toasts; S.settings.toasts = false;
  const buttons = $$('[data-act="skip"]'); buttons.forEach(b => b.disabled = true);
  try {
    for (let i = 0; i < steps && S === state; i++) {
      S.timeOffset = originalOffset + hours * HOUR * (i + 1) / steps;
      const now = gameNow();
      for (const p of S.posts) { p.ea += dh; stepPost(p, now, dh * HOUR, events); }
      stepPlayerReposts(dh);
      tickLive(Date.now(), dh * 3600);
      // Previously visited NPC channels also move forward when outside their view.
      for (const room of Object.values(S.live.rooms)) {
        if (room.id === LIVE_WATCHING && currentRoute().name === 'live') continue;
        room.elapsed += dh * 3600; room.lastWall = Date.now();
        const due = room.pending.filter(job => job.at <= room.elapsed);
        room.pending = room.pending.filter(job => job.at > room.elapsed);
        due.forEach(job => guestMessage(room, job.text, job.id, job.type, { reply: true }));
      }
      maybeDM(now, dh * HOUR); runPending(now); careerTick(now);
      if (i % 12 === 0 || i === steps - 1) S.hist.push([now, totalFollowers()]);
      if (i % 24 === 0) {
        const status = $('#world-clock-status'); if (status) status.textContent = `Die Lobby entwickelt sich weiter … ${Math.round((i + 1) / steps * 100)} %`;
        await new Promise(resolve => setTimeout(resolve, 0));
      }
    }
    if (S !== state) return;
    S.hist = S.hist.slice(-600);
    while (S.reached < MILESTONES.length && totalFollowers() >= MILESTONES[S.reached]) {
      notify({ type: 'milestone', text: `Du hast ${fmtFull(MILESTONES[S.reached++])} Follower erreicht! 🎉` });
    }
    // Keep bounded DM storage even after repeated week-long skips.
    for (const c of Object.values(S.dms)) c.msgs = c.msgs.slice(-150);

    if (S === state) {

    }
    ADVANCING_WORLD = false; buttons.forEach(b => b.disabled = false);
  }
  await save(); renderSide(); renderRoute(true); lobbyPulse(true);
  note(`${hours === 168 ? 'Eine Woche' : fmtFull(hours) + ' Stunden'} für deine ganze Lobby vorgespult`);
}

// Reach is a finite wave tied to the audience of the account that shared a post.
function sharePotential(followers) { return Math.min(2e8, Math.max(0, Number(followers) || 0) * .18); }

function stepPlayerReposts(hours) {
  if (!(hours > 0)) return;
  for (const [key, it] of Object.entries(S.npcInter)) {
    const w = it.shareWave; if (!w || !it.r) continue;
    w.age += hours; w.reach = w.potential * (1 - .97 * Math.exp(-w.age / 3));
    const reward = Math.floor(w.reach * .0015 * mult('growth'));
    const earned = Math.min(Math.max(0, reward - w.rewarded), Math.max(0, 2e9 - totalFollowers()));

}
function repostInfoHTML(v) {
  const reach = v.mine ? repostReach(v.p) : (v.inter.shareWave?.reach || 0);
  return `<div class="repost-reach" data-repost-info>${v.inter.r ? '↻ Von dir geteilt · ' : ''}+<span data-live="rv">${fmt(Math.floor(reach))}</span> Aufrufe durch Reposts</div>`;
}

  return `<section class="live-card creator-shared"><h3>Gemeinsam auf Sendung</h3><p class="muted">Co-Stream oder Gastauftritt: fünf Minuten gemeinsam live ergeben je 150 B¢ und +3 Vertrauen. Raids bringen einen Teil des eigenen Publikums in den anderen Stream. Jede Einladung muss angenommen werden.</p>${invite && Date.now() < invite.expires ? `<div class="creator-notice">${esc(l.partner?.profile.name || 'Deine Partner-Lobby')} lädt dich ein: ${esc({duet:'Co-Stream',guest:'Gastauftritt',raid:'Raid'}[invite.kind])}${invite.kind === 'raid' ? ` mit bis zu ${fmt(invite.count)} Zuschauern` : ''}.<div class="creator-actions"><button class="btn acc sm" data-act="shared-accept">Annehmen</button><button class="btn ghost sm" data-act="shared-decline">Ablehnen</button></div></div>` : ''}${event ? `<div class="creator-notice">${event.kind === 'guest' ? 'Gemeinsamer Gastauftritt' : 'Co-Stream'} · ${event.done ? 'Abgeschlossen ✓' : `${liveDuration(event.seconds)} / 5:00 gemeinsam live`}<br>Mit ${esc(l.partner?.profile.name || 'deinem Partner')}<div><button class="creator-text-button" data-act="shared-stop">Gemeinsamen Auftritt beenden</button></div></div>` : ''}${l.outgoing && Date.now() < l.outgoing.expires ? '<p class="creator-caption">Einladung versendet – warte auf die Antwort.</p>' : `<div class="creator-actions">${[['duet','Co-Stream einladen'],['guest','Als Gast einladen'],['raid','Raid anbieten']].map(([kind,label]) => `<button class="btn ghost sm" data-act="shared-invite" data-kind="${kind}" ${!online || !s || s.paused || !remote || remote.paused || event || (kind === 'raid' && s.sharedRaided) ? 'disabled' : ''}>${label}</button>`).join('')}</div>`}<p class="creator-caption">Beide Spieler müssen live und verbunden sein. Eine Pause oder Trennung stoppt den gemeinsamen Fortschritt.</p></section>`;
}
const eventPartnerContent = lobbyPartnerContent;
lobbyPartnerContent = () => eventPartnerContent() + (S.lobby.partner ? careerSharedHTML() : '');
const eventReceivePacket = receiveLobbyPacket;
receiveLobbyPacket = function(data) {
  if (!String(data.type).startsWith('shared-')) return eventReceivePacket(data);
  LOBBY.lastReceived = Date.now();
  const l = S.lobby, s = S.live.active, remote = l.partner?.live;
  if (!lobbyConnected() || !/^[A-Z2-9]{24}$/.test(data.id || '')) return;
  if (data.type === 'shared-invite') {
    if (!['duet','guest','raid'].includes(data.kind) || !s || s.paused || S.settings.paused || !remote || remote.paused || s.id !== data.target || remote.id !== data.source || l.shared || (l.invite && Date.now() < l.invite.expires) || l.seen.includes(data.id)) return;
    l.seen.push(data.id); l.seen = l.seen.slice(-256);
    l.invite = { id:data.id,kind:data.kind,source:data.source,target:data.target,count:Math.min(lobbyNumber(data.count),Math.round(remote.viewers)),expires:Date.now()+120000 };
    notify({type:'milestone',text:`${l.partner.profile.name} lädt dich zu ${data.kind === 'raid' ? 'einem Raid' : 'einem gemeinsamen Stream'} ein. Öffne die Spieler-Lobby.`});
  } else if (data.type === 'shared-answer') {
    const invite = l.outgoing;
    if (!invite || invite.id !== data.id) return;
    l.outgoing = null;
    if (!data.accepted || Date.now() > invite.expires || !s || s.id !== invite.source || !remote || remote.id !== invite.target) { note('Einladung beendet oder nicht mehr verfügbar.'); return; }
    if (invite.kind === 'raid') { s.sharedRaided = true; addLiveMessage(`Deine Crew besucht jetzt @${l.partner.profile.handle}. Danke für den gemeinsamen Support!`,null,'event'); finishLive(); location.hash = '#/lobby'; }
    else { l.shared = {id:invite.id,kind:invite.kind,local:s.id,remote:remote.id,seconds:0,done:false}; addLiveMessage(`Gemeinsam live mit @${l.partner.profile.handle}!`,null,'event'); }
  } else if (data.type === 'shared-stop' && l.shared?.id === data.id) { l.shared = null; note('Der gemeinsame Auftritt wurde beendet.'); }
  markDirty(); lobbyRefresh();
};
function careerSharedTick(s, dt) {
  const event = S.lobby.shared, remote = S.lobby.partner?.live;
  if (!event || event.done || !lobbyConnected() || event.local !== s.id || remote?.id !== event.remote || remote.paused) return;
  // Fast-forward is local: it cannot simulate the other human's attendance.
  if (ADVANCING_WORLD || dt > 5) return;
  event.seconds += dt;
  if (event.seconds >= 300) { event.done = true; if (careerPayOnce('shared:' + event.id,150,'Gemeinsamer Live-Auftritt')) { careerTrust(3); S.career.metrics.events++; } addLiveMessage('Fünf Minuten gemeinsam live! Eure Communities wachsen zusammen 💜',null,'event'); }
  markDirty();
}
Object.assign(ACT, {
  'shared-invite': b => {
    const l = S.lobby, s = S.live.active, remote = l.partner?.live, kind = b.dataset.kind;
    if (!lobbyConnected() || !s || s.paused || S.settings.paused || !remote || remote.paused || l.shared || (l.outgoing && Date.now() < l.outgoing.expires) || !['duet','guest','raid'].includes(kind) || (kind === 'raid' && s.sharedRaided)) return;
    const invite = {id:lobbyToken(),kind,source:s.id,target:remote.id,count:Math.floor(s.viewers*.75),expires:Date.now()+120000};
    if (lobbySend({type:'shared-invite',...invite})) { l.outgoing = invite; markDirty(); lobbyRefresh(); }
  },
  'shared-accept': () => {
    const l = S.lobby, i = l.invite, s = S.live.active, remote = l.partner?.live;
    if (!i || !lobbyConnected() || Date.now() > i.expires || !s || s.paused || S.settings.paused || s.id !== i.target || remote?.id !== i.source || remote.paused || l.shared) return;
    if (!lobbySend({type:'shared-answer',id:i.id,accepted:true})) return;
    l.invite = null;
    if (i.kind === 'raid') { const count = Math.min(i.count,Math.floor(remote.viewers*.75)); s.raidAudience = Math.min(2e9,(s.raidAudience || 0)+count); s.raidAt = s.elapsed; addLiveMessage(`Raid von @${l.partner.profile.handle}! ${fmt(count)} Zuschauer kommen zur Unterstützung dazu 💜`,null,'event'); gainLiveFollowers(Math.floor(count*.03)); }
    else { l.shared = {id:i.id,kind:i.kind,local:s.id,remote:remote.id,seconds:0,done:false}; addLiveMessage(`Gemeinsam live mit @${l.partner.profile.handle}!`,null,'event'); }
    markDirty(); lobbyPulse(true); lobbyRefresh();
  },
  'shared-decline': () => { const i = S.lobby.invite; if (!i) return; lobbySend({type:'shared-answer',id:i.id,accepted:false}); S.lobby.invite = null; markDirty(); lobbyRefresh(); },
  'shared-stop': () => { const event = S.lobby.shared; if (!event) return; lobbySend({type:'shared-stop',id:event.id}); S.lobby.shared = null; markDirty(); lobbyRefresh(); }
});

</script>
<script>
// Bundled from bubble-creator.js
"use strict";

// Glue kept separate from the simulation so old saves retain their settings.
VIEWS.career = r => ({ contracts: careerContractsView, community: careerCommunityView, stories: careerStoriesView, shop: careerShopView, finance: careerFinanceView, saves: careerSavesView }[r.a] || careerHomeView)();
VIEW_AFTER.career = r => { if (r.a === 'saves') vaultRenderSlots(); LIVE_HOOK = careerRefreshNumbers; };
const creatorOriginalNPC = npc;
npc = function(id) { const n = creatorOriginalNPC(id), edit = S?.career?.npcEdits[id]; if (!edit) return n; HANDLES.set(edit.handle, Number(id)); return { ...n, ...edit, first: edit.name.split(' ')[0] }; };
const creatorHome = VIEWS.home;
VIEWS.home = r => creatorHome(r).replace('<div id="feed">', careerWelcomeHTML() + '<div id="feed">');
const creatorSettings = VIEWS.settings;
VIEWS.settings = r => creatorSettings(r) + `<section class="st-sec"><h2>Bubble bleibt kostenlos</h2><p>Alle Spielfunktionen sind kostenlos. Es gibt keinen Kaufpreis, kein echtes Abo und keine In-App-Käufe. B¢ verdienst du ausschließlich im Spiel. Kooperationen, Kanal-Abos und Spenden sind Teil der Simulation.</p></section><section class="st-sec"><h2>Spielstände mit Medien</h2><p>Die bisherigen JSON-Dateien enthalten keine hochgeladenen Medien. Das neue vollständige Backup sichert auch deine Bilder und Videos.</p><a class="btn acc" href="#/career/saves">Backups & Speicherplätze öffnen</a></section>`;
const creatorProfileBadge = liveProfileBadge;
liveProfileBadge = function(a) { return creatorProfileBadge(a) + (a && !a.me ? careerRelationLine(a.id) : ''); };
const creatorStartLive = startLive;
startLive = function(...args) { const prior = S.live.active; const result = creatorStartLive(...args); if (!prior && S.live.active) { S.career.metrics.streams++; careerSound(); markDirty(); } return result; };
ACT['live-start'] = startLive;
document.addEventListener('click', e => { if (VAULT_SWITCHING && e.target.closest('button,a,input')) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
const creatorGreeting = liveGreeting;
liveGreeting = function(id) { const r = S.career?.relations[id]; if (r?.score >= 30) return `Hey @${S.me.handle}! Nach unseren Gesprächen auf Bubble freue ich mich richtig auf diesen Stream 💜`; if (r?.score < 0) return `Ich schaue mal rein, @${S.me.handle}. Bei unserer letzten Diskussion waren wir nicht einer Meinung.`; return creatorGreeting(id); };
const creatorNPCAnswer = npcAnswer;
npcAnswer = function(text, n, seed, ctx) { const answer = creatorNPCAnswer(text,n,seed,ctx), r = S?.career?.relations[n.id]; return answer + (h32(seed,'relationship') % 4 === 0 ? r?.score >= 30 ? ' Schön, dass wir inzwischen öfter miteinander reden 💜' : r?.score < 0 ? ' Wir sehen eben nicht alles gleich.' : '' : ''); };
const creatorLockedActions = ['setfollowers', 'preset', 'growth-preset', 'growth-set-followers', 'growth-set-viewers'];
for (const key of creatorLockedActions) { const original = ACT[key]; if (original) ACT[key] = (...args) => careerMode() ? note('Die Karriere nutzt feste Wachstumsregeln. Ausstattung und Inhalte verbessern deine Reichweite.') : original(...args); }
document.addEventListener('change', e => { if (careerMode() && e.target.id === 'growth-auto') { e.stopImmediatePropagation(); e.preventDefault(); e.target.checked = true; } }, true);
function careerAfterRoute() {
  careerApplyStage();
  if (careerMode()) {
    const selectors = creatorLockedActions.map(k => `[data-act="${k}"]`).concat(['#set-f','#growth-followers','#growth-viewers','#growth-auto','[data-growth-range]','[data-growth-number]', ...['reach','likes','comments','growth','viral','speed'].flatMap(k => [`[data-lever="${k}"]`, `[data-levern="${k}"]`])]);
    $$(selectors.join(',')).forEach(e => { e.disabled = true; e.title = 'Karriere: Wachstum entsteht durch Inhalte und Ausstattung.'; });
    if (currentRoute().name === 'studio' || (currentRoute().name === 'live' && currentRoute().a === 'growth')) $('#view').insertAdjacentHTML('beforeend', '<div class="creator-notice">Karriere-Modus: Deine Reichweite wächst durch Inhalte, Vertrauen und Ausstattung. <a href="#/career/shop">Zum Studio-Shop ↗</a></div>');
  }
}
function careerRefreshLive() {
  if (!S?.career) return;
  careerRefreshNumbers();
  const slot = $('#creator-live-panel'); if (slot) { const html = careerStudioPanel(); if (slot.innerHTML !== html) slot.innerHTML = html; }
  careerApplyStage();
  const s = S.live.active;
  if (s && !s.paused && !S.settings.paused && S.career.staff?.active && s.elapsed - (s.lastAssist || 0) > 90) { s.lastAssist = s.elapsed; addLiveMessage('Willkommen! Bleibt freundlich. Fragen an den Streamer könnt ihr hier im Chat stellen 💜', h32(S.seed, 'creator-assistant'), 'npc', { badge: 'Assistenz' }); }
}
ACT['creator-reach'] = b => {
  const p = S.posts.find(p => p.id === +b.dataset.id); if (!p) return;
  const reposts = Math.min(p.st.v, p.st.rv || 0), c = S.career;
  openModal('Deine Reichweite verstehen', `<div class="creator-form"><p><b>${fmtFull(p.st.v)} tatsächliche Aufrufe</b></p><p>Davon rund ${fmtFull(reposts)} durch Reposts. Der übrige Anteil entsteht aus deiner Community, Entdeckung und möglichen viralen Wellen.</p><p>Deine Ausstattung: +${Math.round((c.upgrades.light * .08 + c.upgrades.edit * .05) * 100)} % Basis-Reichweite. ${careerMode() ? `Vertrauen: ${Math.round(c.trust)} %. Passende Beiträge in deiner Nische erhalten zusätzlich 12 %.` : `Freier Reichweiten-Regler: ${S.settings.reach} %.`}</p><p>Reposts berücksichtigen die Followerzahl des teilenden Kontos. Sie verteilen zusätzliche Aufrufe über die Zeit; bereits erreichte Aufrufe bleiben bestehen.</p></div>`, '<button class="btn acc" data-act="close-modal">Verstanden</button>');
};
